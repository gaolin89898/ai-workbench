<!DOCTYPE html>
<html class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工作台 - 工作台</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="font-sans antialiased" style="font-family: var(--font-sans); background: var(--color-bg-app); color: var(--color-text-primary);">
  <main class="min-h-screen" style="padding: 12px 16px 96px; max-width: 480px; margin: 0 auto;">
    <header class="flex items-center justify-between" style="padding: 4px 0 14px; gap: 12px;">
      <div class="min-w-0">
        <h1 style="font-size: 24px; line-height: 1.2; font-weight: var(--font-weight-bold); letter-spacing: -0.02em; color: var(--color-text-primary); text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">工作台</h1>
        <p class="truncate" style="margin-top: 4px; font-size: var(--text-sm); color: var(--color-text-secondary);">AI Workbench · 今日 4 个活动会话</p>
      </div>
      <button data-dom-id="device-switcher" class="tap-target inline-flex items-center justify-center whitespace-nowrap" style="height: 36px; gap: 6px; padding: 0 10px; border-radius: var(--radius-lg); border: 1px solid var(--color-border); background: var(--color-bg-surface); color: var(--color-text-primary); font-size: var(--text-sm); font-weight: var(--font-weight-semibold);" aria-label="切换设备">
        <i data-lucide="monitor" style="width: 16px; height: 16px;"></i>
        <span>桌面端</span>
        <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--color-text-muted);"></i>
      </button>
    </header>

    <section style="border-radius: 22px; padding: 18px; background: var(--color-primary); color: var(--color-text-inverse); overflow: hidden; position: relative;">
      <div style="position: absolute; right: -50px; top: -52px; width: 136px; height: 136px; border-radius: var(--radius-full); background: var(--color-primary-muted);"></div>
      <div class="relative">
        <div class="flex items-start justify-between" style="gap: 12px;">
          <div class="min-w-0">
            <div class="flex items-center" style="gap: 8px; margin-bottom: 8px;">
              <span class="inline-flex items-center justify-center whitespace-nowrap" style="height: 24px; padding: 0 8px; border-radius: var(--radius-full); background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.22); font-size: var(--text-xs); font-weight: var(--font-weight-semibold);">运行中</span>
              <span class="truncate" style="font-size: var(--text-xs); opacity: 0.82;">当前活动项目</span>
            </div>
            <h2 class="truncate" style="font-size: 22px; line-height: var(--leading-tight); font-weight: var(--font-weight-bold); letter-spacing: -0.02em; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">my-saas-app</h2>
            <p class="line-clamp-2" style="margin-top: 8px; font-size: var(--text-sm); line-height: var(--leading-normal); opacity: 0.82;">正在同步桌面端上下文，最近会话可继续进入项目处理。</p>
          </div>
          <button data-dom-id="hero-ai-tools" class="tap-target shrink-0 inline-flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.24); background: rgba(255,255,255,0.14); color: var(--color-text-inverse);" aria-label="AI 工具">
            <i data-lucide="bot" style="width: 19px; height: 19px;"></i>
          </button>
        </div>
        <div class="grid grid-cols-3" style="gap: 10px; margin-top: 18px; border-top: 1px solid rgba(255,255,255,0.18); padding-top: 14px;">
          <div>
            <strong style="display: block; font-size: 24px; line-height: 1; font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums;">4</strong>
            <span class="truncate" style="display: block; margin-top: 7px; font-size: var(--text-xs); opacity: 0.78;">活跃会话</span>
          </div>
          <div style="border-left: 1px solid rgba(255,255,255,0.18); padding-left: 10px;">
            <strong style="display: block; font-size: 24px; line-height: 1; font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums;">28</strong>
            <span class="truncate" style="display: block; margin-top: 7px; font-size: var(--text-xs); opacity: 0.78;">AI 调用</span>
          </div>
          <div style="border-left: 1px solid rgba(255,255,255,0.18); padding-left: 10px;">
            <strong style="display: block; font-size: 24px; line-height: 1; font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums;">2</strong>
            <span class="truncate" style="display: block; margin-top: 7px; font-size: var(--text-xs); opacity: 0.78;">待处理</span>
          </div>
        </div>
      </div>
    </section>

    <section style="margin-top: 20px;">
      <div class="flex items-center justify-between" style="margin-bottom: 12px; gap: 12px;">
        <h2 style="font-size: var(--text-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">快捷操作</h2>
        <span class="truncate" style="font-size: var(--text-sm); color: var(--color-text-muted);">任务入口</span>
      </div>
      <div class="grid grid-cols-2" style="gap: 12px;">
        <button data-dom-id="quick-new-session" class="tap-target action-card flex items-center text-left" style="gap: 12px; min-height: 68px; padding: 12px; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg-surface); color: var(--color-text-primary);">
          <span class="inline-flex shrink-0 items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--color-primary-soft); color: var(--color-primary);"><i data-lucide="plus" style="width: 20px; height: 20px;"></i></span>
          <span class="min-w-0 flex-1">
            <span class="truncate" style="display: block; font-size: var(--text-md); font-weight: var(--font-weight-semibold);">新建会话</span>
            <span class="truncate" style="display: block; margin-top: 4px; font-size: var(--text-sm); color: var(--color-text-muted);">从项目开始</span>
          </span>
        </button>
        <button data-dom-id="quick-sync-project" class="tap-target action-card flex items-center text-left" style="gap: 12px; min-height: 68px; padding: 12px; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg-surface); color: var(--color-text-primary);">
          <span class="inline-flex shrink-0 items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--color-primary-soft); color: var(--color-primary);"><i data-lucide="refresh-cw" style="width: 19px; height: 19px;"></i></span>
          <span class="min-w-0 flex-1">
            <span class="truncate" style="display: block; font-size: var(--text-md); font-weight: var(--font-weight-semibold);">同步项目</span>
            <span class="truncate" style="display: block; margin-top: 4px; font-size: var(--text-sm); color: var(--color-text-muted);">更新桌面端</span>
          </span>
        </button>
      </div>
    </section>

    <section style="margin-top: 20px; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg-surface); overflow: hidden;">
      <div class="flex items-center justify-between" style="gap: 12px; padding: 14px 14px 10px;">
        <div class="min-w-0">
          <h2 style="font-size: var(--text-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">项目概览</h2>
          <p class="truncate" style="margin-top: 4px; font-size: var(--text-sm); color: var(--color-text-muted);">桌面端设备 · 在线</p>
        </div>
        <button data-dom-id="open-projects" class="tap-target inline-flex shrink-0 items-center justify-center whitespace-nowrap" style="height: 32px; padding: 0 10px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-bg-surface); color: var(--color-primary); font-size: var(--text-sm); font-weight: var(--font-weight-semibold);">项目</button>
      </div>
      <div class="grid grid-cols-3" style="padding: 10px 14px 14px; gap: 0; border-top: 1px solid var(--color-border);">
        <div>
          <strong style="display: block; font-size: 20px; line-height: 1; font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums;">12</strong>
          <span class="truncate" style="display: block; margin-top: 7px; font-size: var(--text-xs); color: var(--color-text-muted);">文件变更</span>
        </div>
        <div style="border-left: 1px solid var(--color-border); padding-left: 12px;">
          <strong style="display: block; font-size: 20px; line-height: 1; font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums;">3</strong>
          <span class="truncate" style="display: block; margin-top: 7px; font-size: var(--text-xs); color: var(--color-text-muted);">分支</span>
        </div>
        <div style="border-left: 1px solid var(--color-border); padding-left: 12px;">
          <strong style="display: block; font-size: 20px; line-height: 1; font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums;">86%</strong>
          <span class="truncate" style="display: block; margin-top: 7px; font-size: var(--text-xs); color: var(--color-text-muted);">同步率</span>
        </div>
      </div>
    </section>

    <section style="margin-top: 22px;">
      <div class="flex items-center justify-between" style="margin-bottom: 12px; gap: 12px;">
        <h2 style="font-size: var(--text-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">最近会话</h2>
        <button data-dom-id="view-all-sessions" class="tap-target inline-flex items-center justify-center whitespace-nowrap" style="height: 32px; padding: 0 4px; border: 0; background: transparent; color: var(--color-primary); font-size: var(--text-sm); font-weight: var(--font-weight-semibold);">查看全部</button>
      </div>
      <div style="border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg-surface); overflow: hidden;">
        <article data-dom-id="session-auth-bug" class="tap-target session-row flex items-center" style="gap: 12px; padding: 14px; border-bottom: 1px solid var(--color-border); color: var(--color-text-primary);">
          <span class="shrink-0 inline-flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--color-bg-input); color: var(--state-error);"><i data-lucide="bug" style="width: 19px; height: 19px;"></i></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center" style="gap: 8px;">
              <h3 class="truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">修复认证 bug</h3>
              <span class="inline-flex shrink-0 items-center justify-center whitespace-nowrap" style="height: 22px; padding: 0 7px; border-radius: var(--radius-full); background: var(--color-bg-input); color: var(--state-error); font-size: var(--text-xs); font-weight: var(--font-weight-semibold);">待处理</span>
            </div>
            <p class="truncate" style="margin-top: 4px; font-size: var(--text-sm); color: var(--color-text-muted);">登录态失效 · 8 分钟前</p>
          </div>
          <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-muted);"></i>
        </article>
        <article data-dom-id="session-api-performance" class="tap-target session-row flex items-center" style="gap: 12px; padding: 14px; border-bottom: 1px solid var(--color-border); color: var(--color-text-primary);">
          <span class="shrink-0 inline-flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--color-bg-input); color: var(--state-warning);"><i data-lucide="activity" style="width: 19px; height: 19px;"></i></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center" style="gap: 8px;">
              <h3 class="truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">优化 API 性能</h3>
              <span class="inline-flex shrink-0 items-center justify-center whitespace-nowrap" style="height: 22px; padding: 0 7px; border-radius: var(--radius-full); background: var(--color-bg-input); color: var(--state-warning); font-size: var(--text-xs); font-weight: var(--font-weight-semibold);">进行中</span>
            </div>
            <p class="truncate" style="margin-top: 4px; font-size: var(--text-sm); color: var(--color-text-muted);">慢查询分析 · 26 分钟前</p>
          </div>
          <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-muted);"></i>
        </article>
        <article data-dom-id="session-db-query" class="tap-target session-row flex items-center" style="gap: 12px; padding: 14px; color: var(--color-text-primary);">
          <span class="shrink-0 inline-flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--color-bg-input); color: var(--state-success);"><i data-lucide="database" style="width: 19px; height: 19px;"></i></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center" style="gap: 8px;">
              <h3 class="truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">重构数据库查询</h3>
              <span class="inline-flex shrink-0 items-center justify-center whitespace-nowrap" style="height: 22px; padding: 0 7px; border-radius: var(--radius-full); background: var(--color-bg-input); color: var(--state-success); font-size: var(--text-xs); font-weight: var(--font-weight-semibold);">已完成</span>
            </div>
            <p class="truncate" style="margin-top: 4px; font-size: var(--text-sm); color: var(--color-text-muted);">索引补充 · 1 小时前</p>
          </div>
          <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-muted);"></i>
        </article>
      </div>
    </section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-30" style="min-height: 72px; background: rgba(255,255,255,0.96); border-top: 1px solid var(--color-border); backdrop-filter: blur(16px); padding-bottom: env(safe-area-inset-bottom);">
    <div class="grid grid-cols-3" style="height: 72px; max-width: 480px; margin: 0 auto; padding: 6px 16px 8px; gap: 8px;">
      <a data-dom-id="nav-dashboard" aria-current="page" class="tap-target bottom-tab flex flex-col items-center justify-center" style="gap: 4px; border-radius: var(--radius-lg); color: var(--color-primary); background: var(--color-primary-soft);" href="#">
        <i data-lucide="layout-dashboard" style="width: 20px; height: 20px;"></i>
        <span style="font-size: var(--text-xs); font-weight: var(--font-weight-semibold);">工作台</span>
      </a>
      <a data-dom-id="nav-projects" class="tap-target bottom-tab flex flex-col items-center justify-center" style="gap: 4px; border-radius: var(--radius-lg); color: var(--color-text-muted);" href="#">
        <i data-lucide="folder-kanban" style="width: 20px; height: 20px;"></i>
        <span style="font-size: var(--text-xs); font-weight: var(--font-weight-medium);">项目</span>
      </a>
      <a data-dom-id="nav-settings" class="tap-target bottom-tab flex flex-col items-center justify-center" style="gap: 4px; border-radius: var(--radius-lg); color: var(--color-text-muted);" href="#">
        <i data-lucide="settings" style="width: 20px; height: 20px;"></i>
        <span style="font-size: var(--text-xs); font-weight: var(--font-weight-medium);">设置</span>
      </a>
    </div>
  </nav>
  <style>
    .tap-target {
      min-width: 44px;
      min-height: 44px;
      transition: transform 140ms cubic-bezier(.2,.8,.2,1), background-color 140ms cubic-bezier(.2,.8,.2,1), border-color 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1);
      -webkit-tap-highlight-color: transparent;
    }
    .tap-target:active {
      transform: translateY(1px);
    }
    .tap-target:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }
    .action-card:active,
    .session-row:active,
    .bottom-tab:active {
      background: var(--color-bg-active);
    }
    @media (hover: hover) and (pointer: fine) {
      .action-card:hover,
      .session-row:hover,
      .bottom-tab:hover {
        border-color: var(--color-border-active);
        background: var(--color-bg-hover);
      }
      button[data-dom-id="view-all-sessions"]:hover {
        transform: translateX(2px);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .tap-target {
        transition-duration: 0.01ms;
      }
      .tap-target:active,
      button[data-dom-id="view-all-sessions"]:hover {
        transform: none;
      }
    }
  </style>
  <script>lucide.createIcons();</script>
</body>
</html>
