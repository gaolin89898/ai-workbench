<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工作台 — 对话右键菜单</title>
    <style id="theme-vars">
/* AI Workbench Desktop — Dark Theme */
/* Based on actual project style.css, inverted to dark */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.15);
  --color-primary-soft: rgba(37, 99, 235, 0.08);
  --color-primary-ring: rgba(37, 99, 235, 0.25);

  /* Surface & Background */
  --color-bg-app: #0f1117;
  --color-bg-body: #111318;
  --color-bg-sidebar: #161822;
  --color-bg-main: #1a1d2e;
  --color-bg-content: #1e2235;
  --color-bg-surface: #1e2235;
  --color-bg-elevated: #252a3a;
  --color-bg-input: #1e2235;
  --color-bg-hover: rgba(255, 255, 255, 0.06);
  --color-bg-active: rgba(37, 99, 235, 0.12);

  /* Text */
  --color-text-primary: #e8eaed;
  --color-text-body: #d1d5db;
  --color-text-secondary: #9aa0b4;
  --color-text-muted: #6b7280;
  --color-text-placeholder: #6b7280;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: rgba(255, 255, 255, 0.1);
  --color-border-subtle: rgba(255, 255, 255, 0.06);
  --color-border-active: rgba(37, 99, 235, 0.5);

  /* State Colors */
  --state-success: #22c55e;
  --state-success-bg: rgba(34, 197, 94, 0.12);
  --state-success-ring: rgba(34, 197, 94, 0.25);
  --state-warning: #f59e0b;
  --state-warning-bg: rgba(245, 158, 11, 0.12);
  --state-error: #ef4444;
  --state-error-bg: rgba(239, 68, 68, 0.12);
  --state-info: #3b82f6;
  --state-info-bg: rgba(59, 130, 246, 0.12);

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 7px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;
  --leading-chat: 1.62;

  /* Font Weights */
  --fw-normal: 400;
  --fw-medium: 500;
  --fw-semibold: 620;
  --fw-bold: 700;
  --fw-extrabold: 800;
  --fw-black: 850;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.15);
  --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.35);
  --shadow-composer: 0 16px 42px rgba(0, 0, 0, 0.3);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-14: 56px;
  --space-18: 72px;

  /* Layout */
  --sidebar-width: 286px;
  --topbar-height: 56px;
  --composer-max-width: 760px;

  /* Transitions */
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin: 0; background: var(--color-bg-body); color: var(--color-text-primary); font-family: var(--font-sans); height: 100vh; overflow: hidden;">
    <main style="display: grid; grid-template-columns: 286px minmax(760px, 1fr); height: 100vh; overflow: hidden;">

      <!-- ============================================================ -->
      <!-- LEFT SIDEBAR — SidebarProjectTree.vue                       -->
      <!-- ============================================================ -->
      <aside style="background: var(--color-bg-sidebar); border-right: 1px solid var(--color-border); padding: 18px 10px 14px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;">

        <!-- 项目 section header -->
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 13px; font-weight: 650; color: var(--color-text-muted);">项目</span>
          <button style="width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent; color: var(--color-text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;" aria-label="添加项目">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
          </button>
        </div>

        <!-- Project tree -->
        <div style="display: flex; flex-direction: column; gap: 2px;">

          <!-- my-saas-app project (expanded) -->
          <div style="display: flex; flex-direction: column;">
            <!-- Project row -->
            <div style="display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px;">
              <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--color-text-muted); flex-shrink: 0;"></i>
              <i data-lucide="folder" style="width: 18px; height: 18px; color: var(--color-text-secondary); flex-shrink: 0;"></i>
              <span style="font-size: 14px; font-weight: 620; color: var(--color-text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">my-saas-app</span>
              <span style="font-size: 11px; color: var(--color-text-muted); background: var(--color-bg-elevated); padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.5;">main</span>
            </div>

            <!-- Session list under my-saas-app -->
            <div style="padding-left: 32px; display: flex; flex-direction: column; gap: 3px;">

              <!-- 修复认证 bug (active / selected — context menu targets this) -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; background: var(--color-bg-hover); cursor: pointer; position: relative;">
                <span style="font-size: 13px; color: var(--color-text-body); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">修复认证 bug</span>
              </div>

              <!-- 优化 API 性能 -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; cursor: pointer;">
                <span style="font-size: 13px; color: var(--color-text-muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">优化 API 性能</span>
              </div>

              <!-- 添加单元测试 -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; cursor: pointer;">
                <span style="font-size: 13px; color: var(--color-text-muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">添加单元测试</span>
              </div>

            </div>
          </div>

          <!-- ai-workbench project (collapsed) -->
          <div style="display: flex; flex-direction: column;">
            <!-- Project row -->
            <div style="display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px;">
              <i data-lucide="chevron-right" style="width: 14px; height: 14px; color: var(--color-text-muted); flex-shrink: 0;"></i>
              <i data-lucide="folder" style="width: 18px; height: 18px; color: var(--color-text-secondary); flex-shrink: 0;"></i>
              <span style="font-size: 14px; font-weight: 620; color: var(--color-text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">ai-workbench</span>
            </div>

            <!-- Session list under ai-workbench -->
            <div style="padding-left: 32px; display: flex; flex-direction: column; gap: 3px;">

              <!-- 重构数据库查询 -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; cursor: pointer;">
                <span style="font-size: 13px; color: var(--color-text-muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">重构数据库查询</span>
              </div>

            </div>
          </div>

        </div>

        <!-- Spacer pushing settings to bottom -->
        <div style="flex: 1; min-height: 0;"></div>

        <!-- Settings button at bottom -->
        <button style="min-height: 42px; border: none; background: transparent; color: var(--color-text-secondary); cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0 6px; font-size: 14px; font-weight: 650; font-family: var(--font-sans);" aria-label="设置">
          <i data-lucide="settings" style="width: 18px; height: 18px;"></i>
          <span>设置</span>
        </button>

      </aside>

      <!-- ============================================================ -->
      <!-- MAIN CONTENT — ChatView codex-start empty state              -->
      <!-- ============================================================ -->
      <div style="background: var(--color-bg-content); display: flex; flex-direction: column; height: 100vh; overflow: hidden;">

        <!-- Center area -->
        <div style="display: grid; place-items: center; min-height: 100vh; padding: 48px 32px;">
          <div style="width: min(730px, 100%); display: grid; gap: 28px; justify-items: center; transform: translateY(-28px);">

            <!-- Heading -->
            <h1 style="font-size: 28px; font-weight: 520; color: var(--color-text-primary); text-align: center; line-height: 1.25; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word; margin: 0;">
              在 my-saas-app 中要做什么？
            </h1>

            <!-- Prompt box container -->
            <div style="width: 100%; border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-bg-surface); box-shadow: var(--shadow-composer); position: relative;">
              <textarea
                style="width: 100%; min-height: 112px; max-height: 160px; border-radius: 18px; padding: 14px 66px 52px 14px; font-size: 14px; line-height: 1.5; resize: none; background: transparent; color: var(--color-text-primary); border: none; outline: none; font-family: var(--font-sans);"
                placeholder="描述你想做什么..."
                rows="3"
                aria-label="输入提示"
              ></textarea>

              <!-- Provider selector button -->
              <button style="position: absolute; left: 14px; bottom: 14px; height: 32px; background: transparent; border: none; color: var(--color-text-secondary); font-size: 13px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 0 4px; font-family: var(--font-sans);" aria-label="选择模型">
                <i data-lucide="sparkles" style="width: 19px; height: 19px; color: var(--color-primary);"></i>
                <span>Codex</span>
                <i data-lucide="chevron-down" style="width: 14px; height: 14px;"></i>
              </button>

              <!-- Send button -->
              <button style="position: absolute; right: 14px; bottom: 14px; width: 34px; height: 34px; border: 1px solid var(--color-primary-muted); border-radius: 999px; background: var(--color-primary-muted); color: var(--color-primary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;" aria-label="发送">
                <i data-lucide="arrow-up" style="width: 19px; height: 19px;"></i>
              </button>

            </div>

          </div>
        </div>

      </div>

    </main>

    <!-- ============================================================ -->
    <!-- SESSION CONTEXT MENU (right-click overlay)                    -->
    <!-- ============================================================ -->
    <div id="session-context-menu" style="position: fixed; z-index: 1000; left: 220px; top: 280px; width: 168px; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; background: var(--color-bg-elevated); padding: 4px 0; box-shadow: var(--shadow-lg);">

      <!-- Section 1 -->
      <button class="ctx-item" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 28px; padding: 0 18px; font-size: 14px; font-weight: 400; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; font-family: var(--font-sans);">
        <i data-lucide="pin" style="width: 18px; height: 18px; opacity: 0.85; flex-shrink: 0;"></i>
        <span>置顶对话</span>
      </button>
      <button class="ctx-item" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 28px; padding: 0 18px; font-size: 14px; font-weight: 400; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; font-family: var(--font-sans);">
        <i data-lucide="pencil" style="width: 18px; height: 18px; opacity: 0.85; flex-shrink: 0;"></i>
        <span>重命名对话</span>
      </button>
      <button class="ctx-item" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 28px; padding: 0 18px; font-size: 14px; font-weight: 400; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; font-family: var(--font-sans);">
        <i data-lucide="archive" style="width: 18px; height: 18px; opacity: 0.85; flex-shrink: 0;"></i>
        <span>归档对话</span>
      </button>
      <button class="ctx-item" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 28px; padding: 0 18px; font-size: 14px; font-weight: 400; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; font-family: var(--font-sans);">
        <i data-lucide="mail" style="width: 18px; height: 18px; opacity: 0.85; flex-shrink: 0;"></i>
        <span>标记为未读</span>
      </button>

      <!-- Section 2 divider -->
      <div style="border-top: 1px solid var(--color-border-subtle); margin: 2px 0;"></div>

      <button class="ctx-item" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 28px; padding: 0 18px; font-size: 14px; font-weight: 400; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; font-family: var(--font-sans);">
        <i data-lucide="key" style="width: 18px; height: 18px; opacity: 0.85; flex-shrink: 0;"></i>
        <span>复制会话 ID</span>
      </button>
      <button class="ctx-item" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 28px; padding: 0 18px; font-size: 14px; font-weight: 400; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; font-family: var(--font-sans);">
        <i data-lucide="link" style="width: 18px; height: 18px; opacity: 0.85; flex-shrink: 0;"></i>
        <span>复制深度链接</span>
      </button>

      <!-- Section 3 divider -->
      <div style="border-top: 1px solid var(--color-border-subtle); margin: 2px 0;"></div>

      <button class="ctx-item" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 28px; padding: 0 18px; font-size: 14px; font-weight: 400; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; font-family: var(--font-sans);">
        <i data-lucide="git-branch" style="width: 18px; height: 18px; opacity: 0.85; flex-shrink: 0;"></i>
        <span>派生到本地</span>
      </button>
      <button class="ctx-item ctx-disabled" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 28px; padding: 0 18px; font-size: 14px; font-weight: 400; border: 0; background: transparent; color: var(--color-text-muted); opacity: 0.55; cursor: not-allowed; font-family: var(--font-sans);">
        <i data-lucide="git-fork" style="width: 18px; height: 18px; opacity: 0.55; flex-shrink: 0;"></i>
        <span>派生到新工作树</span>
      </button>

      <!-- Section 4 divider -->
      <div style="border-top: 1px solid var(--color-border-subtle); margin: 2px 0;"></div>

      <button class="ctx-item" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 28px; padding: 0 18px; font-size: 14px; font-weight: 400; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; font-family: var(--font-sans);">
        <i data-lucide="app-window" style="width: 18px; height: 18px; opacity: 0.85; flex-shrink: 0;"></i>
        <span>在新窗口中打开</span>
      </button>

    </div>

    <style>
      /* Context menu item hover */
      .ctx-item:hover { background: var(--color-bg-hover); }
      .ctx-disabled:hover { background: transparent; }
      /* Placeholder and scrollbar styles */
      textarea::placeholder { color: var(--color-text-placeholder); }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-bg-elevated); border-radius: 999px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
