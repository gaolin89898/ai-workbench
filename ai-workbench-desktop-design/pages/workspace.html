<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工作台</title>
    <style id="theme-vars">
/* AI Workbench Desktop — Dark Developer Tool Theme */
/* Inspired by Codex Desktop + Trae Work */
:root {
  /* Brand */
  --color-primary: #3b82f6;
  --color-primary-hover: #2563eb;
  --color-primary-muted: rgba(59, 130, 246, 0.15);
  --color-primary-soft: rgba(59, 130, 246, 0.08);

  /* Surface & Background */
  --color-bg-app: #0f1117;
  --color-bg-sidebar: #161822;
  --color-bg-main: #1a1d2e;
  --color-bg-surface: #1e2235;
  --color-bg-elevated: #252a3a;
  --color-bg-input: #1e2235;
  --color-bg-hover: rgba(255, 255, 255, 0.04);
  --color-bg-active: rgba(59, 130, 246, 0.1);

  /* Text */
  --color-text-primary: #e8eaed;
  --color-text-secondary: #9aa0b4;
  --color-text-muted: #6b7280;
  --color-text-inverse: #0f1117;

  /* Border */
  --color-border: rgba(255, 255, 255, 0.08);
  --color-border-active: rgba(59, 130, 246, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.25);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.35);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* Layout */
  --sidebar-width: 272px;
  --topbar-height: 48px;
  --composer-height: auto;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-bg-app);">
    <main>

      <!-- ============================================================ -->
      <!-- FULLSCREEN WORKSPACE LANDING — NO SIDEBAR                    -->
      <!-- Completely different layout from chat-session/providers/settings -->
      <!-- ============================================================ -->

      <!-- HERO SECTION — gradient top ~40vh -->
      <section class="relative flex flex-col" style="min-height: 40vh; background: linear-gradient(180deg, var(--color-bg-sidebar) 0%, var(--color-bg-app) 100%);">

        <!-- Subtle dot-grid decorative overlay -->
        <div class="absolute inset-0 pointer-events-none" style="opacity: 0.03; background-image: radial-gradient(var(--color-text-muted) 1px, transparent 1px); background-size: 28px 28px;"></div>

        <!-- Top bar: brand title (left) + user avatar (right) -->
        <header class="relative z-10 flex items-center justify-between px-6 pt-5 pb-3 sm:px-12">
          <div class="flex items-center gap-3">
            <div class="flex items-center justify-center shrink-0" style="width: 34px; height: 34px; border-radius: var(--radius-md); background: var(--color-primary-muted);">
              <i data-lucide="grid-3x3" style="width: 18px; height: 18px; color: var(--color-primary);"></i>
            </div>
            <h1 class="whitespace-nowrap" style="font-size: 22px; font-weight: var(--font-weight-bold); color: var(--color-text-primary);">AI 工作台</h1>
          </div>

          <div class="flex items-center gap-3">
            <span class="truncate hidden sm:inline" style="font-size: var(--text-md); color: var(--color-text-secondary);">开发者</span>
            <div class="flex items-center justify-center shrink-0" style="width: 34px; height: 34px; border-radius: var(--radius-full); background: var(--color-primary);">
              <span style="font-size: var(--text-sm); font-weight: var(--font-weight-semibold); color: #ffffff;">开</span>
            </div>
          </div>
        </header>

        <!-- Centered prompt area -->
        <div class="relative z-10 flex-1 flex items-center justify-center px-6 sm:px-8 pb-10">
          <div class="w-full" style="max-width: 680px;">

            <h2 class="text-center mb-8" style="font-size: 28px; font-weight: var(--font-weight-bold); color: var(--color-text-primary); text-wrap: balance; word-break: keep-all; overflow-wrap: break-word; line-height: var(--leading-tight);">
              在 my-saas-app 中要做什么？
            </h2>

            <!-- Prompt input box -->
            <div class="relative prompt-box" style="border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg-input); box-shadow: var(--shadow-elevated); transition: border-color 0.2s, box-shadow 0.2s;">
              <textarea
                class="w-full resize-none outline-none"
                style="font-family: var(--font-sans); font-size: var(--text-md); color: var(--color-text-primary); background: transparent; padding: var(--space-4); padding-bottom: 56px; min-height: 120px; line-height: var(--leading-normal); border-radius: var(--radius-lg);"
                placeholder="描述你想做什么..."
                rows="3"
                aria-label="输入提示"
              ></textarea>

              <!-- Bottom action bar -->
              <div class="absolute bottom-0 left-0 right-0 flex items-center justify-between px-3 py-2.5">
                <!-- Provider selector pill -->
                <button class="inline-flex items-center gap-1.5 px-3 py-1.5 whitespace-nowrap" style="font-size: var(--text-xs); font-weight: var(--font-weight-medium); border-radius: var(--radius-full); background: var(--color-bg-elevated); color: var(--color-text-secondary); border: 1px solid var(--color-border);" aria-label="选择模型">
                  <i data-lucide="sparkles" style="width: 12px; height: 12px; color: var(--color-primary);"></i>
                  <span>Codex</span>
                  <i data-lucide="chevron-down" style="width: 12px; height: 12px;"></i>
                </button>

                <!-- Send button (blue, rounded) -->
                <button class="inline-flex items-center justify-center whitespace-nowrap" style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-primary);" aria-label="发送">
                  <i data-lucide="arrow-up" style="width: 16px; height: 16px; color: #ffffff;"></i>
                </button>
              </div>
            </div>

          </div>
        </div>
      </section>

      <!-- QUICK ACTIONS — 4 compact cards like macOS Launchpad -->
      <section class="px-6 sm:px-12 pt-8 pb-6">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mx-auto" style="max-width: 840px;">

          <!-- 新建会话 (blue accent) -->
          <button class="flex flex-col items-center justify-center gap-3 py-6 px-4 transition-colors" style="border-radius: var(--radius-lg); background: var(--color-bg-surface); border: 1px solid var(--color-border);" aria-label="新建会话">
            <div class="flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--color-primary-muted);">
              <i data-lucide="sparkles" style="width: 20px; height: 20px; color: var(--color-primary);"></i>
            </div>
            <span class="whitespace-nowrap" style="font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-primary);">新建会话</span>
          </button>

          <!-- 查看项目 (neutral) -->
          <button class="flex flex-col items-center justify-center gap-3 py-6 px-4 transition-colors" style="border-radius: var(--radius-lg); background: var(--color-bg-surface); border: 1px solid var(--color-border);" aria-label="查看项目">
            <div class="flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--color-bg-elevated);">
              <i data-lucide="folder" style="width: 20px; height: 20px; color: var(--color-text-secondary);"></i>
            </div>
            <span class="whitespace-nowrap" style="font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">查看项目</span>
          </button>

          <!-- AI 工具 (neutral) -->
          <button class="flex flex-col items-center justify-center gap-3 py-6 px-4 transition-colors" style="border-radius: var(--radius-lg); background: var(--color-bg-surface); border: 1px solid var(--color-border);" aria-label="AI 工具">
            <div class="flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--color-bg-elevated);">
              <i data-lucide="cpu" style="width: 20px; height: 20px; color: var(--color-text-secondary);"></i>
            </div>
            <span class="whitespace-nowrap" style="font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">AI 工具</span>
          </button>

          <!-- 设置 (neutral) -->
          <button class="flex flex-col items-center justify-center gap-3 py-6 px-4 transition-colors" style="border-radius: var(--radius-lg); background: var(--color-bg-surface); border: 1px solid var(--color-border);" aria-label="设置">
            <div class="flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--color-bg-elevated);">
              <i data-lucide="settings" style="width: 20px; height: 20px; color: var(--color-text-secondary);"></i>
            </div>
            <span class="whitespace-nowrap" style="font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">设置</span>
          </button>

        </div>
      </section>

      <!-- RECENT SESSIONS — 3 session cards in a row -->
      <section class="px-6 sm:px-12 pt-4 pb-12">
        <div class="mx-auto" style="max-width: 840px;">

          <h3 class="mb-4 truncate" style="font-size: var(--text-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">最近会话</h3>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">

            <!-- Session 1: 添加认证流程 -->
            <div class="flex items-start gap-3 p-4" style="border-radius: var(--radius-lg); background: var(--color-bg-surface); border: 1px solid var(--color-border);">
              <div class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--color-primary-muted);">
                <i data-lucide="sparkles" style="width: 16px; height: 16px; color: var(--color-primary);"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="truncate" style="font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-text-primary);">添加认证流程</p>
                <p class="truncate mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-muted);">my-saas-app</p>
                <div class="flex items-center gap-1.5 mt-2">
                  <span class="shrink-0" style="width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--state-success);"></span>
                  <span class="whitespace-nowrap" style="font-size: var(--text-xs); color: var(--color-text-muted);">已完成</span>
                </div>
              </div>
            </div>

            <!-- Session 2: 修复导航栏响应式 -->
            <div class="flex items-start gap-3 p-4" style="border-radius: var(--radius-lg); background: var(--color-bg-surface); border: 1px solid var(--color-border);">
              <div class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--color-bg-elevated);">
                <i data-lucide="bot" style="width: 16px; height: 16px; color: var(--state-warning);"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="truncate" style="font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-text-primary);">修复导航栏响应式</p>
                <p class="truncate mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-muted);">my-saas-app</p>
                <div class="flex items-center gap-1.5 mt-2">
                  <span class="shrink-0" style="width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--state-warning);"></span>
                  <span class="whitespace-nowrap" style="font-size: var(--text-xs); color: var(--color-text-muted);">进行中</span>
                </div>
              </div>
            </div>

            <!-- Session 3: 优化数据库查询 -->
            <div class="flex items-start gap-3 p-4" style="border-radius: var(--radius-lg); background: var(--color-bg-surface); border: 1px solid var(--color-border);">
              <div class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--color-bg-elevated);">
                <i data-lucide="message-square" style="width: 16px; height: 16px; color: var(--color-text-secondary);"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="truncate" style="font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-text-primary);">优化数据库查询</p>
                <p class="truncate mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-muted);">ai-workbench</p>
                <div class="flex items-center gap-1.5 mt-2">
                  <span class="shrink-0" style="width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-text-muted);"></span>
                  <span class="whitespace-nowrap" style="font-size: var(--text-xs); color: var(--color-text-muted);">已暂停</span>
                </div>
              </div>
            </div>

          </div>
        </div>
      </section>

    </main>

    <style>
      body { background: var(--color-bg-app) !important; color: var(--color-text-primary); }
      textarea::placeholder { color: var(--color-text-muted); }
      .prompt-box:focus-within {
        border-color: var(--color-border-active) !important;
        box-shadow: 0 0 0 3px var(--color-primary-muted), var(--shadow-elevated) !important;
      }
      button:hover { opacity: 0.9; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-bg-elevated); border-radius: var(--radius-full); }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
