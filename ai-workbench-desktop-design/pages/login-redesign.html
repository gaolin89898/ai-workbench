<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workbench - 登录</title>
    <style id="theme-vars">
/* AI Workbench Desktop — Dark Theme */
/* Based on actual project style.css, inverted to dark */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.15);
  --color-primary-soft: rgba(37, 99, 235, 0.08);
  --color-primary-ring: rgba(37, 99, 235, 0.25);

  /* Surface & Background */
  --color-bg-app: #0f1117;
  --color-bg-body: #111318;
  --color-bg-sidebar: #161822;
  --color-bg-main: #1a1d2e;
  --color-bg-content: #1e2235;
  --color-bg-surface: #1e2235;
  --color-bg-elevated: #252a3a;
  --color-bg-input: #1e2235;
  --color-bg-hover: rgba(255, 255, 255, 0.06);
  --color-bg-active: rgba(37, 99, 235, 0.12);

  /* Text */
  --color-text-primary: #e8eaed;
  --color-text-body: #d1d5db;
  --color-text-secondary: #9aa0b4;
  --color-text-muted: #6b7280;
  --color-text-placeholder: #6b7280;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: rgba(255, 255, 255, 0.1);
  --color-border-subtle: rgba(255, 255, 255, 0.06);
  --color-border-active: rgba(37, 99, 235, 0.5);

  /* State Colors */
  --state-success: #22c55e;
  --state-success-bg: rgba(34, 197, 94, 0.12);
  --state-success-ring: rgba(34, 197, 94, 0.25);
  --state-warning: #f59e0b;
  --state-warning-bg: rgba(245, 158, 11, 0.12);
  --state-error: #ef4444;
  --state-error-bg: rgba(239, 68, 68, 0.12);
  --state-info: #3b82f6;
  --state-info-bg: rgba(59, 130, 246, 0.12);

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 7px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;
  --leading-chat: 1.62;

  /* Font Weights */
  --fw-normal: 400;
  --fw-medium: 500;
  --fw-semibold: 620;
  --fw-bold: 700;
  --fw-extrabold: 800;
  --fw-black: 850;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.15);
  --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.35);
  --shadow-composer: 0 16px 42px rgba(0, 0, 0, 0.3);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-14: 56px;
  --space-18: 72px;

  /* Layout */
  --sidebar-width: 286px;
  --topbar-height: 56px;
  --composer-max-width: 760px;

  /* Transitions */
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;

  /* Semantic aliases for Tailwind @theme inline bridge */
  --color-background: var(--color-bg-app);
  --color-foreground: var(--color-text-primary);
  --color-card: var(--color-bg-elevated);
  --color-muted: var(--color-text-muted);
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-lg);
  --color-radius-lg: var(--radius-xl);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-foreground: var(--color-foreground);
    --color-card: var(--color-card);
    --color-primary: var(--color-primary);
    --color-muted: var(--color-muted);
    --color-border: var(--color-border);
    --radius-sm: var(--color-radius-sm);
    --radius-md: var(--color-radius-md);
    --radius-lg: var(--color-radius-lg);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--color-background); }
      .text-background { color: var(--color-background); }
      .border-background { border-color: var(--color-background); }
      .ring-background { --tw-ring-color: var(--color-background); }
      .bg-foreground { background-color: var(--color-foreground); }
      .text-foreground { color: var(--color-foreground); }
      .border-foreground { border-color: var(--color-foreground); }
      .ring-foreground { --tw-ring-color: var(--color-foreground); }
      .bg-card { background-color: var(--color-card); }
      .text-card { color: var(--color-card); }
      .border-card { border-color: var(--color-card); }
      .ring-card { --tw-ring-color: var(--color-card); }
      .bg-primary { background-color: var(--color-primary); }
      .text-primary { color: var(--color-primary); }
      .border-primary { border-color: var(--color-primary); }
      .ring-primary { --tw-ring-color: var(--color-primary); }
      .bg-muted { background-color: var(--color-muted); }
      .text-muted { color: var(--color-muted); }
      .border-muted { border-color: var(--color-muted); }
      .ring-muted { --tw-ring-color: var(--color-muted); }
      .bg-border { background-color: var(--color-border); }
      .text-border { color: var(--color-border); }
      .border-border { border-color: var(--color-border); }
      .ring-border { --tw-ring-color: var(--color-border); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: stretch; justify-content: stretch; background: var(--color-bg-app); font-family: var(--font-sans); overflow: hidden;">

<main style="width: 100%; min-height: 100vh; display: flex; flex-direction: row;">

    <!-- ===== LEFT: Brand Showcase (60%) ===== -->
    <section style="width: 60%; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: var(--space-18) var(--space-14); position: relative; overflow: hidden; background: var(--color-bg-app);">

        <!-- Background: subtle grid pattern + glow -->
        <div style="position: absolute; inset: 0; pointer-events: none; overflow: hidden;">
            <!-- Grid -->
            <div style="position: absolute; inset: 0; background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
                background-size: 48px 48px;"></div>
            <!-- Top-right glow -->
            <div style="position: absolute; top: -120px; right: -80px; width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(circle, rgba(37,99,235,0.12) 0%, transparent 70%);"></div>
            <!-- Bottom-left glow -->
            <div style="position: absolute; bottom: -100px; left: -60px; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(37,99,235,0.08) 0%, transparent 70%);"></div>
            <!-- Geometric accent lines -->
            <div style="position: absolute; top: 15%; right: 12%; width: 1px; height: 120px; background: linear-gradient(180deg, transparent, rgba(37,99,235,0.2), transparent);"></div>
            <div style="position: absolute; bottom: 25%; left: 8%; width: 80px; height: 1px; background: linear-gradient(90deg, transparent, rgba(37,99,235,0.15), transparent);"></div>
        </div>

        <!-- Brand content (relative to sit above bg) -->
        <div style="position: relative; z-index: 1; max-width: 520px;">

            <!-- Logo + Brand Name -->
            <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-10);">
                <div style="width: 44px; height: 44px; border-radius: var(--radius-lg); background: var(--color-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <i data-lucide="terminal" style="width: 22px; height: 22px; color: var(--color-text-inverse);"></i>
                </div>
                <span style="font-size: var(--text-xl); font-weight: var(--fw-bold); color: var(--color-text-primary); line-height: var(--leading-tight); letter-spacing: -0.01em;">AI Workbench</span>
            </div>

            <!-- Tagline -->
            <h1 style="margin: 0 0 var(--space-14) 0; font-size: clamp(28px, 3.2vw, 44px); font-weight: var(--fw-extrabold); color: var(--color-text-primary); line-height: var(--leading-tight); letter-spacing: -0.02em; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">
                桌面端 AI 编程助手
            </h1>

            <!-- Feature Points -->
            <div style="display: flex; flex-direction: column; gap: var(--space-6);">

                <!-- Feature 1: Smart Code Generation -->
                <div style="display: flex; align-items: flex-start; gap: var(--space-4);">
                    <div style="width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--color-primary-soft); border: 1px solid rgba(37,99,235,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <i data-lucide="code-2" style="width: 18px; height: 18px; color: var(--color-primary);"></i>
                    </div>
                    <div>
                        <p style="margin: 0 0 var(--space-1) 0; font-size: var(--text-md); font-weight: var(--fw-semibold); color: var(--color-text-primary); line-height: var(--leading-tight);">智能代码生成</p>
                        <p style="margin: 0; font-size: var(--text-sm); color: var(--color-text-secondary); line-height: var(--leading-normal);">基于多模型推理，精准理解意图，自动生成高质量代码</p>
                    </div>
                </div>

                <!-- Feature 2: Multi-Model Support -->
                <div style="display: flex; align-items: flex-start; gap: var(--space-4);">
                    <div style="width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--color-primary-soft); border: 1px solid rgba(37,99,235,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <i data-lucide="layers" style="width: 18px; height: 18px; color: var(--color-primary);"></i>
                    </div>
                    <div>
                        <p style="margin: 0 0 var(--space-1) 0; font-size: var(--text-md); font-weight: var(--fw-semibold); color: var(--color-text-primary); line-height: var(--leading-tight);">多模型支持</p>
                        <p style="margin: 0; font-size: var(--text-sm); color: var(--color-text-secondary); line-height: var(--leading-normal);">Codex、Claude、OpenCode 等主流模型无缝切换</p>
                    </div>
                </div>

                <!-- Feature 3: Secure Local Execution -->
                <div style="display: flex; align-items: flex-start; gap: var(--space-4);">
                    <div style="width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--color-primary-soft); border: 1px solid rgba(37,99,235,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <i data-lucide="shield-check" style="width: 18px; height: 18px; color: var(--color-primary);"></i>
                    </div>
                    <div>
                        <p style="margin: 0 0 var(--space-1) 0; font-size: var(--text-md); font-weight: var(--fw-semibold); color: var(--color-text-primary); line-height: var(--leading-tight);">安全本地运行</p>
                        <p style="margin: 0; font-size: var(--text-sm); color: var(--color-text-secondary); line-height: var(--leading-normal);">数据不离设备，全本地推理，隐私安全有保障</p>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- ===== RIGHT: Login Form (40%) ===== -->
    <section style="width: 40%; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: var(--space-10) var(--space-8); background: var(--color-bg-main); border-left: 1px solid var(--color-border-subtle);">

        <div style="width: 100%; max-width: 360px;">

            <!-- Header -->
            <div style="margin-bottom: var(--space-10);">
                <h2 style="margin: 0 0 var(--space-2) 0; font-size: var(--text-2xl); font-weight: var(--fw-bold); color: var(--color-text-primary); line-height: var(--leading-tight); letter-spacing: -0.01em; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">登录到 AI Workbench</h2>
                <p style="margin: 0; font-size: var(--text-md); color: var(--color-text-secondary); line-height: var(--leading-normal);">输入你的账号信息以继续</p>
            </div>

            <!-- Login Form -->
            <form onsubmit="return false;" style="display: flex; flex-direction: column;">

                <!-- Account Input -->
                <div style="margin-bottom: var(--space-5);">
                    <div style="position: relative;">
                        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 42px; display: flex; align-items: center; justify-content: center; pointer-events: none;">
                            <i data-lucide="user" style="width: 16px; height: 16px; color: var(--color-text-muted);"></i>
                        </div>
                        <input
                            type="text"
                            placeholder="请输入账号"
                            style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 var(--space-4) 0 42px; font-size: var(--text-base); font-family: var(--font-sans); color: var(--color-text-primary); background: var(--color-bg-input); border: 1px solid var(--color-border); border-radius: var(--radius-lg); outline: none; transition: border-color var(--transition-fast);"
                            onfocus="this.style.borderColor='var(--color-border-active)'"
                            onblur="this.style.borderColor='var(--color-border)'"
                        />
                    </div>
                </div>

                <!-- Password Input -->
                <div style="margin-bottom: var(--space-4);">
                    <div style="position: relative;">
                        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 42px; display: flex; align-items: center; justify-content: center; pointer-events: none;">
                            <i data-lucide="lock" style="width: 16px; height: 16px; color: var(--color-text-muted);"></i>
                        </div>
                        <input
                            id="password-input"
                            type="password"
                            placeholder="请输入密码"
                            style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 42px 0 42px; font-size: var(--text-base); font-family: var(--font-sans); color: var(--color-text-primary); background: var(--color-bg-input); border: 1px solid var(--color-border); border-radius: var(--radius-lg); outline: none; transition: border-color var(--transition-fast);"
                            onfocus="this.style.borderColor='var(--color-border-active)'"
                            onblur="this.style.borderColor='var(--color-border)'"
                        />
                        <button
                            type="button"
                            id="toggle-password"
                            onclick="var inp = document.getElementById('password-input'); var isPassword = inp.type === 'password'; inp.type = isPassword ? 'text' : 'password'; this.innerHTML = isPassword ? '<i data-lucide=&quot;eye-off&quot; style=&quot;width:16px;height:16px;color:var(--color-text-muted)&quot;></i>' : '<i data-lucide=&quot;eye&quot; style=&quot;width:16px;height:16px;color:var(--color-text-muted)&quot;></i>'; lucide.createIcons();"
                            style="position: absolute; right: 0; top: 0; bottom: 0; width: 42px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; padding: 0;"
                        >
                            <i data-lucide="eye" style="width: 16px; height: 16px; color: var(--color-text-muted);"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me + Forgot Password -->
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-6);">
                    <label style="display: flex; align-items: center; gap: var(--space-2); cursor: pointer; font-size: var(--text-sm); color: var(--color-text-secondary); line-height: 1;">
                        <input type="checkbox" style="width: 16px; height: 16px; accent-color: var(--color-primary); cursor: pointer; flex-shrink: 0;" />
                        <span style="white-space: nowrap;">记住我</span>
                    </label>
                    <a href="#" onclick="return false;" style="font-size: var(--text-sm); color: var(--color-primary); text-decoration: none; white-space: nowrap; transition: color var(--transition-fast);" onmouseenter="this.style.color='var(--color-primary-hover)'" onmouseleave="this.style.color='var(--color-primary)'">忘记密码？</a>
                </div>

                <!-- Login Button -->
                <button
                    type="button"
                    style="width: 100%; height: 44px; box-sizing: border-box; font-size: var(--text-md); font-weight: var(--fw-bold); font-family: var(--font-sans); color: var(--color-text-inverse); background: var(--color-primary); border: none; border-radius: var(--radius-lg); cursor: pointer; transition: background var(--transition-fast); letter-spacing: 0.01em;"
                    onmouseenter="this.style.background='var(--color-primary-hover)'"
                    onmouseleave="this.style.background='var(--color-primary)'"
                >登录</button>

                <!-- Divider -->
                <div style="display: flex; align-items: center; gap: var(--space-4); margin: var(--space-6) 0;">
                    <div style="flex: 1; height: 1px; background: var(--color-border);"></div>
                    <span style="font-size: var(--text-sm); color: var(--color-text-muted); white-space: nowrap;">或</span>
                    <div style="flex: 1; height: 1px; background: var(--color-border);"></div>
                </div>

                <!-- Third-Party Login -->
                <div style="display: flex; gap: var(--space-3);">
                    <!-- GitHub -->
                    <button
                        type="button"
                        style="flex: 1; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-size: var(--text-md); font-weight: var(--fw-medium); font-family: var(--font-sans); color: var(--color-text-primary); background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg); cursor: pointer; transition: background var(--transition-fast), border-color var(--transition-fast);"
                        onmouseenter="this.style.background='var(--color-bg-hover)'; this.style.borderColor='var(--color-border-active)'"
                        onmouseleave="this.style.background='var(--color-bg-elevated)'; this.style.borderColor='var(--color-border)'"
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                        GitHub
                    </button>
                    <!-- Google -->
                    <button
                        type="button"
                        style="flex: 1; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-size: var(--text-md); font-weight: var(--fw-medium); font-family: var(--font-sans); color: var(--color-text-primary); background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg); cursor: pointer; transition: background var(--transition-fast), border-color var(--transition-fast);"
                        onmouseenter="this.style.background='var(--color-bg-hover)'; this.style.borderColor='var(--color-border-active)'"
                        onmouseleave="this.style.background='var(--color-bg-elevated)'; this.style.borderColor='var(--color-border)'"
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 001 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Google
                    </button>
                </div>

                <!-- Sign Up Link -->
                <p style="margin: var(--space-6) 0 0 0; font-size: var(--text-sm); color: var(--color-text-muted); text-align: center; line-height: var(--leading-normal);">还没有账号？<a href="#" onclick="return false;" style="color: var(--color-primary); text-decoration: none; font-weight: var(--fw-medium); transition: color var(--transition-fast);" onmouseenter="this.style.color='var(--color-primary-hover)'" onmouseleave="this.style.color='var(--color-primary)'">立即注册</a></p>
            </form>

            <!-- Footer -->
