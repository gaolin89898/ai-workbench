<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面设备</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin:0; padding:0; background:var(--color-bg-app); font-family:var(--font-sans); min-height:100vh;">

  <!-- Top App Bar -->
  <header style="position:sticky; top:0; z-index:30; background:var(--color-bg-surface); border-bottom:1px solid var(--color-border); padding:0 var(--space-4);">
    <div style="display:flex; align-items:center; justify-content:space-between; height:56px;">
      <h1 style="margin:0; font-size:var(--text-lg); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); line-height:var(--leading-tight);">桌面设备</h1>
      <button style="display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); border:none; background:var(--color-primary-muted); cursor:pointer; color:var(--color-primary);" aria-label="Link device">
        <i data-lucide="link" style="width:18px; height:18px;"></i>
      </button>
    </div>
  </header>

  <main style="padding:var(--space-4) var(--space-4) var(--space-8);">

    <!-- Device Card 1: Online (green accent bar) -->
    <div style="display:flex; align-items:center; gap:var(--space-3); padding:var(--space-4); background:var(--color-bg-surface); border-radius:var(--radius-lg); border-left:3px solid var(--state-success); box-shadow:var(--shadow-card); margin-bottom:var(--space-3);">
      <div style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:var(--radius-md); background:rgba(34,197,94,0.1); flex-shrink:0;">
        <i data-lucide="monitor" style="width:20px; height:20px; color:var(--state-success);"></i>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="margin:0 0 2px 0; font-size:var(--text-md); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); line-height:var(--leading-tight); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Workstation</p>
        <p style="margin:0; font-size:var(--text-sm); color:var(--color-text-secondary); line-height:var(--leading-normal); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">macOS &middot; 在线</p>
      </div>
      <i data-lucide="chevron-right" style="width:18px; height:18px; color:var(--color-text-muted); flex-shrink:0;"></i>
    </div>

    <!-- Device Card 2: Offline (gray accent bar) -->
    <div style="display:flex; align-items:center; gap:var(--space-3); padding:var(--space-4); background:var(--color-bg-surface); border-radius:var(--radius-lg); border-left:3px solid var(--color-text-muted); box-shadow:var(--shadow-card); margin-bottom:var(--space-3);">
      <div style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:var(--radius-md); background:var(--color-bg-input); flex-shrink:0;">
        <i data-lucide="monitor" style="width:20px; height:20px; color:var(--color-text-muted);"></i>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="margin:0 0 2px 0; font-size:var(--text-md); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); line-height:var(--leading-tight); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Home Desktop</p>
        <p style="margin:0; font-size:var(--text-sm); color:var(--color-text-muted); line-height:var(--leading-normal); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Windows 11 &middot; 离线</p>
      </div>
      <i data-lucide="chevron-right" style="width:18px; height:18px; color:var(--color-text-muted); flex-shrink:0;"></i>
    </div>

    <!-- Device Card 3: Online (green accent bar) -->
    <div style="display:flex; align-items:center; gap:var(--space-3); padding:var(--space-4); background:var(--color-bg-surface); border-radius:var(--radius-lg); border-left:3px solid var(--state-success); box-shadow:var(--shadow-card); margin-bottom:var(--space-3);">
      <div style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:var(--radius-md); background:rgba(34,197,94,0.1); flex-shrink:0;">
        <i data-lucide="monitor" style="width:20px; height:20px; color:var(--state-success);"></i>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="margin:0 0 2px 0; font-size:var(--text-md); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); line-height:var(--leading-tight); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Cloud Server</p>
        <p style="margin:0; font-size:var(--text-sm); color:var(--color-text-secondary); line-height:var(--leading-normal); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Ubuntu &middot; 在线</p>
      </div>
      <i data-lucide="chevron-right" style="width:18px; height:18px; color:var(--color-text-muted); flex-shrink:0;"></i>
    </div>

    <!-- Empty state hint -->
    <p style="text-align:center; font-size:var(--text-sm); color:var(--color-text-muted); line-height:var(--leading-relaxed); margin-top:var(--space-8); padding:0 var(--space-6);">没有配对设备？从桌面应用生成配对码，然后点击上方的连接按钮。</p>

  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
