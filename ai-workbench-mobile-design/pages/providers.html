<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工具</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin:0; padding:0; background:var(--color-bg-app); font-family:var(--font-sans); color:var(--color-text-primary);">

  <!-- Top App Bar -->
  <header style="position:sticky; top:0; z-index:30; border-bottom:1px solid var(--color-border); background:var(--color-bg-surface);">
    <div style="display:flex; align-items:center; justify-content:center; height:56px;">
      <div style="text-align:center; min-width:0;">
        <h1 style="font-size:var(--text-lg); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); margin:0;">AI 工具</h1>
        <p style="font-size:var(--text-xs); color:var(--color-text-muted); font-weight:var(--font-weight-medium); margin:2px 0 0;">3/4 可用</p>
      </div>
    </div>
  </header>

  <main style="padding:var(--space-4) var(--space-4) var(--space-8); display:flex; flex-direction:column; gap:var(--space-3);">

    <!-- Provider Card: Codex (blue border) -->
    <section style="background:var(--color-bg-surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); border-top:4px solid var(--color-primary); overflow:hidden;">
      <div style="display:flex; align-items:start; gap:var(--space-3); padding:var(--space-4) var(--space-4) var(--space-2);">
        <div style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); background:var(--color-primary-muted); flex-shrink:0;">
          <i data-lucide="smart-toy" style="width:20px; height:20px; color:var(--color-primary);"></i>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:center; gap:var(--space-2);">
            <h2 style="font-size:18px; font-weight:var(--font-weight-bold); color:var(--color-text-primary); margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Codex</h2>
            <span style="flex-shrink:0; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--state-success);"></span>
          </div>
          <code style="display:block; font-family:var(--font-mono); font-size:var(--text-sm); color:var(--color-text-muted); margin-top:2px;">$ codex</code>
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:var(--space-2) var(--space-4);">
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--state-success); background:rgba(34,197,94,0.1); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">已安装</span>
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--state-success); background:rgba(34,197,94,0.1); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">已登录</span>
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--color-primary); background:var(--color-primary-muted); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">v2.1.0</span>
      </div>
      <div style="padding:var(--space-1) var(--space-4) var(--space-3);">
        <span style="font-size:var(--text-xs); color:var(--color-text-muted);">上次检查：3 分钟前</span>
      </div>
    </section>

    <!-- Provider Card: Claude Code (purple border) -->
    <section style="background:var(--color-bg-surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); border-top:4px solid #8b5cf6; overflow:hidden;">
      <div style="display:flex; align-items:start; gap:var(--space-3); padding:var(--space-4) var(--space-4) var(--space-2);">
        <div style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); background:rgba(139,92,246,0.12); flex-shrink:0;">
          <i data-lucide="auto-awesome" style="width:20px; height:20px; color:#8b5cf6;"></i>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:center; gap:var(--space-2);">
            <h2 style="font-size:18px; font-weight:var(--font-weight-bold); color:var(--color-text-primary); margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Claude Code</h2>
            <span style="flex-shrink:0; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--state-success);"></span>
          </div>
          <code style="display:block; font-family:var(--font-mono); font-size:var(--text-sm); color:var(--color-text-muted); margin-top:2px;">$ claude</code>
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:var(--space-2) var(--space-4);">
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--state-success); background:rgba(34,197,94,0.1); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">已安装</span>
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--state-success); background:rgba(34,197,94,0.1); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">已登录</span>
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--color-primary); background:var(--color-primary-muted); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">v1.0.85</span>
      </div>
      <div style="padding:var(--space-1) var(--space-4) var(--space-3);">
        <span style="font-size:var(--text-xs); color:var(--color-text-muted);">上次检查：3 分钟前</span>
      </div>
    </section>

    <!-- Provider Card: OpenCode (teal border) -->
    <section style="background:var(--color-bg-surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); border-top:4px solid #14b8a6; overflow:hidden;">
      <div style="display:flex; align-items:start; gap:var(--space-3); padding:var(--space-4) var(--space-4) var(--space-2);">
        <div style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); background:rgba(20,184,166,0.12); flex-shrink:0;">
          <i data-lucide="code" style="width:20px; height:20px; color:#14b8a6;"></i>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:center; gap:var(--space-2);">
            <h2 style="font-size:18px; font-weight:var(--font-weight-bold); color:var(--color-text-primary); margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">OpenCode</h2>
            <span style="flex-shrink:0; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--state-success);"></span>
          </div>
          <code style="display:block; font-family:var(--font-mono); font-size:var(--text-sm); color:var(--color-text-muted); margin-top:2px;">$ opencode</code>
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:var(--space-2) var(--space-4);">
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--state-success); background:rgba(34,197,94,0.1); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">已安装</span>
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--state-success); background:rgba(34,197,94,0.1); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">已登录</span>
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--color-primary); background:var(--color-primary-muted); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">v0.5.2</span>
      </div>
      <div style="padding:var(--space-1) var(--space-4) var(--space-3);">
        <span style="font-size:var(--text-xs); color:var(--color-text-muted);">上次检查：3 分钟前</span>
      </div>
    </section>

    <!-- Provider Card: DeepSeek (orange border, not installed) -->
    <section style="background:var(--color-bg-surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); border-top:4px solid #f97316; overflow:hidden;">
      <div style="display:flex; align-items:start; gap:var(--space-3); padding:var(--space-4) var(--space-4) var(--space-2);">
        <div style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); background:rgba(249,115,22,0.12); flex-shrink:0;">
          <i data-lucide="brain" style="width:20px; height:20px; color:#f97316;"></i>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:center; gap:var(--space-2);">
            <h2 style="font-size:18px; font-weight:var(--font-weight-bold); color:var(--color-text-primary); margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">DeepSeek</h2>
            <span style="flex-shrink:0; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--state-warning);"></span>
          </div>
          <code style="display:block; font-family:var(--font-mono); font-size:var(--text-sm); color:var(--color-text-muted); margin-top:2px;">$ deepseek</code>
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:var(--space-2) var(--space-4);">
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--state-warning); background:rgba(245,158,11,0.1); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">未安装</span>
        <span style="flex-shrink:0; display:inline-flex; align-items:center; font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--color-text-muted); background:var(--color-bg-input); padding:2px 10px; border-radius:var(--radius-full); white-space:nowrap;">未检测到</span>
      </div>
      <div style="padding:var(--space-1) var(--space-4) var(--space-3);">
        <span style="font-size:var(--text-xs); color:var(--color-text-muted);">不可用</span>
      </div>
    </section>

  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
