<!DOCTYPE html>
<html class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工作台 - 关于</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="font-sans antialiased" style="font-family: var(--font-sans); background: var(--color-bg-app); color: var(--color-text-primary); margin: 0;">
  <main class="min-h-screen" style="width: 390px; max-width: 100%; margin: 0 auto; padding: 14px 16px 104px;">
    <header class="flex items-center justify-between" style="padding: 8px 0 18px;">
      <div>
        <p style="font-size: var(--text-sm); color: var(--color-text-muted); margin: 0 0 5px;">产品信息与更新</p>
        <h1 style="font-size: 28px; line-height: 1.15; font-weight: var(--font-weight-bold); letter-spacing: -0.03em; color: var(--color-text-primary); margin: 0;">关于</h1>
      </div>
      <button aria-label="分享应用信息" class="flex items-center justify-center" style="width: 40px; height: 40px; border: 1px solid var(--color-border); border-radius: var(--radius-full); background: var(--color-bg-surface); color: var(--color-text-secondary); box-shadow: var(--shadow-card);">
        <i data-lucide="sparkles" style="width: 18px; height: 18px;"></i>
      </button>
    </header>

    <section style="position: relative; overflow: hidden; border-radius: 26px; padding: 20px; background: linear-gradient(135deg, #ffffff 0%, #eff6ff 62%, #dbeafe 100%); border: 1px solid rgba(191, 219, 254, 0.9); box-shadow: 0 16px 36px rgba(37, 99, 235, 0.12);">
      <div style="position: absolute; right: -42px; top: -52px; width: 128px; height: 128px; border-radius: var(--radius-full); background: rgba(37, 99, 235, 0.08);"></div>
      <div class="relative flex items-center" style="gap: 15px;">
        <div class="flex items-center justify-center shrink-0" style="width: 62px; height: 62px; border-radius: 22px; background: linear-gradient(135deg, #2563eb, #60a5fa); color: #fff; box-shadow: 0 14px 24px rgba(37, 99, 235, 0.22);">
          <i data-lucide="hexagon" style="width: 30px; height: 30px;"></i>
        </div>
        <div class="min-w-0">
          <h2 style="margin: 0; font-size: 21px; line-height: var(--leading-tight); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">AI 工作台</h2>
          <p style="margin: 7px 0 0; font-size: var(--text-md); color: var(--color-text-secondary);">桌面端 AI 编程助手</p>
          <span style="display: inline-flex; margin-top: 10px; padding: 5px 9px; border-radius: var(--radius-full); background: rgba(37, 99, 235, 0.10); color: var(--color-primary); font-size: var(--text-xs); font-weight: var(--font-weight-semibold);">v0.3.2</span>
        </div>
      </div>
    </section>

    <section style="margin-top: 24px;">
      <div class="flex items-end justify-between" style="margin-bottom: 12px;">
        <div>
          <h2 style="margin: 0; font-size: var(--text-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">AI 工具</h2>
          <p style="margin: 4px 0 0; font-size: var(--text-sm); color: var(--color-text-muted);">本机可用的编程助手组件</p>
        </div>
        <span style="font-size: var(--text-xs); color: var(--color-text-muted); font-weight: var(--font-weight-medium);">6 项</span>
      </div>

      <div class="grid grid-cols-2" style="gap: 12px;">
        <article style="min-height: 142px; border: 1px solid var(--color-border); border-radius: 22px; background: var(--color-bg-surface); padding: 14px; box-shadow: var(--shadow-card);">
          <div class="flex items-center justify-between" style="gap: 10px;">
            <span class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: 11px; background: #eef2ff; color: #4f46e5;"><i data-lucide="sparkles" style="width: 17px; height: 17px;"></i></span>
            <span style="font-size: var(--text-xs); color: var(--color-text-muted); font-weight: var(--font-weight-medium);">v1.8.4</span>
          </div>
          <h3 style="margin: 14px 0 4px; font-size: var(--text-md); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">Claude Code</h3>
          <p style="margin: 0; font-size: var(--text-xs); color: var(--color-text-muted);">代码理解与重构</p>
          <button style="margin-top: 13px; width: 100%; height: 32px; border: 0; border-radius: 12px; background: var(--color-primary); color: #fff; font-size: var(--text-sm); font-weight: var(--font-weight-semibold);">升级</button>
        </article>

        <article style="min-height: 142px; border: 1px solid var(--color-border); border-radius: 22px; background: var(--color-bg-surface); padding: 14px; box-shadow: var(--shadow-card);">
          <div class="flex items-center justify-between" style="gap: 10px;">
            <span class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: 11px; background: #f0f9ff; color: #0284c7;"><i data-lucide="hexagon" style="width: 17px; height: 17px;"></i></span>
            <span style="font-size: var(--text-xs); color: var(--color-text-muted); font-weight: var(--font-weight-medium);">v0.9.7</span>
          </div>
          <h3 style="margin: 14px 0 4px; font-size: var(--text-md); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">Codex</h3>
          <p style="margin: 0; font-size: var(--text-xs); color: var(--color-text-muted);">任务规划与补全</p>
          <button style="margin-top: 13px; width: 100%; height: 32px; border: 1px solid var(--color-border); border-radius: 12px; background: #ffffff; color: var(--color-text-secondary); font-size: var(--text-sm); font-weight: var(--font-weight-semibold);">已是最新</button>
        </article>

        <article style="min-height: 142px; border: 1px solid var(--color-border); border-radius: 22px; background: var(--color-bg-surface); padding: 14px; box-shadow: var(--shadow-card);">
          <div class="flex items-center justify-between" style="gap: 10px;">
            <span class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: 11px; background: #ecfdf5; color: #16a34a;"><i data-lucide="diamond" style="width: 17px; height: 17px;"></i></span>
            <span style="font-size: var(--text-xs); color: var(--color-text-muted); font-weight: var(--font-weight-medium);">v2.1.0</span>
          </div>
          <h3 style="margin: 14px 0 4px; font-size: var(--text-md); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">Gemini CLI</h3>
          <p style="margin: 0; font-size: var(--text-xs); color: var(--color-text-muted);">多模态命令行</p>
          <button style="margin-top: 13px; width: 100%; height: 32px; border: 0; border-radius: 12px; background: var(--color-primary); color: #fff; font-size: var(--text-sm); font-weight: var(--font-weight-semibold);">安装</button>
        </article>

        <article style="min-height: 142px; border: 1px solid var(--color-border); border-radius: 22px; background: var(--color-bg-surface); padding: 14px; box-shadow: var(--shadow-card);">
          <div class="flex items-center justify-between" style="gap: 10px;">
            <span class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: 11px; background: #fff7ed; color: #ea580c;"><i data-lucide="code-2" style="width: 17px; height: 17px;"></i></span>
            <span style="font-size: var(--text-xs); color: var(--color-text-muted); font-weight: var(--font-weight-medium);">v0.6.2</span>
          </div>
          <h3 style="margin: 14px 0 4px; font-size: var(--text-md); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">OpenCode</h3>
          <p style="margin: 0; font-size: var(--text-xs); color: var(--color-text-muted);">开源编码代理</p>
          <button style="margin-top: 13px; width: 100%; height: 32px; border: 1px solid var(--color-border); border-radius: 12px; background: #ffffff; color: var(--color-text-secondary); font-size: var(--text-sm); font-weight: var(--font-weight-semibold);">已是最新</button>
        </article>

        <article style="min-height: 142px; border: 1px solid var(--color-border); border-radius: 22px; background: var(--color-bg-surface); padding: 14px; box-shadow: var(--shadow-card);">
          <div class="flex items-center justify-between" style="gap: 10px;">
            <span class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: 11px; background: #fdf2f8; color: #db2777;"><i data-lucide="cat" style="width: 17px; height: 17px;"></i></span>
            <span style="font-size: var(--text-xs); color: var(--color-text-muted); font-weight: var(--font-weight-medium);">v0.4.9</span>
          </div>
          <h3 style="margin: 14px 0 4px; font-size: var(--text-md); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">OpenClaw</h3>
          <p style="margin: 0; font-size: var(--text-xs); color: var(--color-text-muted);">轻量自动化助手</p>
          <button style="margin-top: 13px; width: 100%; height: 32px; border: 0; border-radius: 12px; background: var(--color-primary); color: #fff; font-size: var(--text-sm); font-weight: var(--font-weight-semibold);">升级</button>
        </article>

        <article style="min-height: 142px; border: 1px solid var(--color-border); border-radius: 22px; background: var(--color-bg-surface); padding: 14px; box-shadow: var(--shadow-card);">
          <div class="flex items-center justify-between" style="gap: 10px;">
            <span class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: 11px; background: #fef2f2; color: #ef4444;"><i data-lucide="zap" style="width: 17px; height: 17px;"></i></span>
            <span style="font-size: var(--text-xs); color: var(--color-text-muted); font-weight: var(--font-weight-medium);">v1.2.3</span>
          </div>
          <h3 style="margin: 14px 0 4px; font-size: var(--text-md); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">Hermes</h3>
          <p style="margin: 0; font-size: var(--text-xs); color: var(--color-text-muted);">快速执行通道</p>
          <button style="margin-top: 13px; width: 100%; height: 32px; border: 1px solid var(--color-border); border-radius: 12px; background: #ffffff; color: var(--color-text-secondary); font-size: var(--text-sm); font-weight: var(--font-weight-semibold);">已是最新</button>
        </article>
      </div>
    </section>

    <section style="margin-top: 24px;">
      <h2 style="margin: 0 0 12px; font-size: var(--text-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">应用更新</h2>
      <div style="border: 1px solid var(--color-border); border-radius: 24px; background: var(--color-bg-surface); box-shadow: var(--shadow-card); overflow: hidden;">
        <div style="padding: 16px; border-bottom: 1px solid #edf2f7;">
          <div class="flex items-center justify-between" style="gap: 14px;">
            <div>
              <p style="margin: 0; font-size: var(--text-sm); color: var(--color-text-muted);">当前版本</p>
              <strong style="display: block; margin-top: 4px; font-size: 22px; line-height: 1; color: var(--color-text-primary);">v0.3.2</strong>
            </div>
            <span class="flex items-center justify-center" style="width: 44px; height: 44px; border-radius: 16px; background: var(--color-primary-muted); color: var(--color-primary);"><i data-lucide="zap" style="width: 22px; height: 22px;"></i></span>
          </div>
        </div>
        <div style="padding: 15px 16px 16px;">
          <div class="flex items-center justify-between" style="font-size: var(--text-md); margin-bottom: 10px;">
            <span style="color: var(--color-text-secondary);">更新来源</span>
            <strong style="color: var(--color-text-primary);">GitHub</strong>
          </div>
          <div class="flex items-center justify-between" style="font-size: var(--text-md); margin-bottom: 15px;">
            <span style="color: var(--color-text-secondary);">签名校验</span>
            <strong style="color: var(--state-success);">已启用</strong>
          </div>
          <button style="width: 100%; height: 44px; border: 0; border-radius: 16px; background: var(--color-primary); color: #fff; font-size: var(--text-md); font-weight: var(--font-weight-bold); box-shadow: 0 10px 18px rgba(37, 99, 235, 0.20);">检查更新</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="grid grid-cols-4" style="position: fixed; left: 50%; bottom: 12px; z-index: 30; width: min(366px, calc(100% - 24px)); transform: translateX(-50%); gap: 4px; padding: 8px; border: 1px solid rgba(226, 232, 240, 0.92); border-radius: 24px; background: rgba(255, 255, 255, 0.92); box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12); backdrop-filter: blur(18px);">
    <button class="flex flex-col items-center" style="gap: 4px; min-width: 0; border: 0; border-radius: 18px; background: transparent; color: var(--color-text-muted); padding: 8px 4px 7px;">
      <i data-lucide="layout-dashboard" style="width: 19px; height: 19px;"></i>
      <span style="font-size: var(--text-xs); font-weight: var(--font-weight-medium);">工作台</span>
    </button>
    <button class="flex flex-col items-center" style="gap: 4px; min-width: 0; border: 0; border-radius: 18px; background: transparent; color: var(--color-text-muted); padding: 8px 4px 7px;">
      <i data-lucide="messages-square" style="width: 19px; height: 19px;"></i>
      <span style="font-size: var(--text-xs); font-weight: var(--font-weight-medium);">会话</span>
    </button>
    <button class="flex flex-col items-center" style="gap: 4px; min-width: 0; border: 0; border-radius: 18px; background: var(--color-primary-soft); color: var(--color-primary); padding: 8px 4px 7px;">
      <i data-lucide="info" style="width: 19px; height: 19px;"></i>
      <span style="font-size: var(--text-xs); font-weight: var(--font-weight-bold);">关于</span>
    </button>
    <button class="flex flex-col items-center" style="gap: 4px; min-width: 0; border: 0; border-radius: 18px; background: transparent; color: var(--color-text-muted); padding: 8px 4px 7px;">
      <i data-lucide="settings" style="width: 19px; height: 19px;"></i>
      <span style="font-size: var(--text-xs); font-weight: var(--font-weight-medium);">设置</span>
    </button>
  </nav>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
