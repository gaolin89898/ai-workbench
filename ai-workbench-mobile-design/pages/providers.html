<!DOCTYPE html>
<html class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型供应商 - AI Workbench</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="font-sans antialiased" style="font-family: var(--font-sans); background: #f6f8fb;">
  <main class="min-h-screen pb-6">
    <!-- Header -->
    <div class="sticky top-0 z-20 bg-white border-b" style="border-bottom: 1px solid #eceff3;">
      <div class="flex items-center justify-between px-4" style="height: 56px;">
        <div class="flex items-center gap-2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </div>
        <h1 class="font-semibold truncate" style="font-size: 17px; font-weight: 600; color: #0f172a;">模型供应商</h1>
        <div class="w-5"></div>

    </div>

    <!-- Provider Cards -->

          <div class="shrink-0 w-10 h-10 rounded-lg flex items-center justify-center" style="background: #eff6ff; border-radius: 7px;">

          </div>

            <div class="flex items-center gap-2">
              <span class="truncate" style="font-size: 14px; font-weight: 600; color: #0f172a;">OpenAI</span>
              <span class="w-[9px] h-[9px] rounded-full shrink-0" style="background: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,0.2);"></span>
            </div>
            <p class="truncate mt-0.5" style="font-size: 12px; color: #94a3b8;">GPT-4o, GPT-4o-mini, o1-preview</p>
            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #ecfdf5; color: #22c55e; border-radius: 7px;">已连接</span>
              <span class="inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #eff6ff; color: #2563eb; border-radius: 7px;">3 模型</span>
            </div>
          </div>
        </div>
      </div>

          <div class="shrink-0 w-10 h-10 rounded-lg flex items-center justify-center" style="background: #ecfdf5; border-radius: 7px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>

            </div>

            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #ecfdf5; color: #22c55e; border-radius: 7px;">已连接</span>
              <span class="inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #eff6ff; color: #2563eb; border-radius: 7px;">2 模型</span>

        </div>

          <div class="shrink-0 w-10 h-10 rounded-lg flex items-center justify-center" style="background: #fff7ed; border-radius: 7px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>

            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #f1f5f9; color: #94a3b8; border-radius: 7px;">未连接</span>
              <span class="inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #eff6ff; color: #2563eb; border-radius: 7px;">2 模型</span>

      <!-- Provider 4: Mistral -->

            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #f1f5f9; color: #94a3b8; border-radius: 7px;">未连接</span>

            </div>
          </div>
        </div>
      </div>

      <!-- Provider 5: Ollama (Warning) -->
      <div class="border overflow-hidden" style="border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff;">
        <div class="flex items-center gap-3" style="min-height: 92px; padding: 14px 18px;">
          <div class="shrink-0 w-10 h-10 rounded-lg flex items-center justify-center" style="background: #fef2f2; border-radius: 7px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="truncate" style="font-size: 14px; font-weight: 600; color: #0f172a;">Ollama 本地</span>
              <span class="w-[9px] h-[9px] rounded-full shrink-0" style="background: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,0.2);"></span>
            </div>
            <p class="truncate mt-0.5" style="font-size: 12px; color: #94a3b8;">Llama 3, CodeLlama</p>
            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #fff7ed; color: #f59e0b; border-radius: 7px;">配置错误</span>
              <span class="inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #eff6ff; color: #2563eb; border-radius: 7px;">2 模型</span>

  </main>
</body>
