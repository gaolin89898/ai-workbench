<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作站</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin:0; padding:0; background:var(--color-bg-app); font-family:var(--font-sans);">
  <main style="min-height:100vh; padding-bottom:72px;">

    <!-- Top App Bar -->
    <header style="position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; padding:var(--space-3) var(--space-4); background:var(--color-bg-surface); border-bottom:1px solid var(--color-border);">
      <div style="display:flex; align-items:center; gap:var(--space-2);">
        <i data-lucide="monitor" style="width:20px; height:20px; color:var(--color-primary);"></i>
        <span style="font-size:var(--text-lg); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); white-space:nowrap;">工作站</span>
      </div>
      <button aria-label="Settings" style="display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); border:none; background:transparent; color:var(--color-text-secondary); cursor:pointer;">
        <i data-lucide="settings" style="width:20px; height:20px;"></i>
      </button>
    </header>

    <!-- Metric Cards (horizontal scroll) -->
    <div style="display:flex; gap:var(--space-3); padding:var(--space-4) var(--space-4) 0 var(--space-4); overflow-x:auto;" class="no-scrollbar">

      <!-- Provider Metric -->
      <div style="flex:0 0 auto; min-width:120px; padding:var(--space-4) var(--space-3); border-radius:var(--radius-lg); background:linear-gradient(135deg, var(--color-bg-surface) 0%, rgba(37,99,235,0.06) 100%); border:1px solid var(--color-border); box-shadow:var(--shadow-card);">
        <span style="font-size:var(--text-xs); color:var(--color-text-muted); display:block; margin-bottom:var(--space-1); white-space:nowrap;">提供商</span>
        <span style="font-size:var(--text-xl); font-weight:var(--font-weight-bold); color:var(--color-text-primary); display:block; white-space:nowrap;">3/4</span>
        <span style="font-size:var(--text-xs); color:var(--color-primary); white-space:nowrap;">可用</span>
      </div>

      <!-- Projects Metric -->
      <div style="flex:0 0 auto; min-width:120px; padding:var(--space-4) var(--space-3); border-radius:var(--radius-lg); background:linear-gradient(135deg, var(--color-bg-surface) 0%, rgba(37,99,235,0.04) 100%); border:1px solid var(--color-border); box-shadow:var(--shadow-card);">
        <span style="font-size:var(--text-xs); color:var(--color-text-muted); display:block; margin-bottom:var(--space-1); white-space:nowrap;">项目</span>
        <span style="font-size:var(--text-xl); font-weight:var(--font-weight-bold); color:var(--color-text-primary); display:block; white-space:nowrap;">5</span>
        <span style="font-size:var(--text-xs); color:var(--color-text-secondary); white-space:nowrap;">总计</span>
      </div>

      <!-- Sessions Metric -->
      <div style="flex:0 0 auto; min-width:120px; padding:var(--space-4) var(--space-3); border-radius:var(--radius-lg); background:linear-gradient(135deg, var(--color-bg-surface) 0%, rgba(37,99,235,0.06) 100%); border:1px solid var(--color-border); box-shadow:var(--shadow-card);">
        <span style="font-size:var(--text-xs); color:var(--color-text-muted); display:block; margin-bottom:var(--space-1); white-space:nowrap;">会话</span>
        <span style="font-size:var(--text-xl); font-weight:var(--font-weight-bold); color:var(--color-text-primary); display:block; white-space:nowrap;">12</span>
        <span style="font-size:var(--text-xs); color:var(--color-primary); white-space:nowrap;">活跃</span>
      </div>

    </div>

    <!-- Recent Sessions Section -->
    <section style="padding:var(--space-5) var(--space-4) var(--space-4);">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-3);">
        <h2 style="font-size:var(--text-md); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); margin:0; white-space:nowrap;">最近会话</h2>
        <button style="display:inline-flex; align-items:center; gap:var(--space-1); padding:var(--space-1) var(--space-2); border-radius:var(--radius-md); border:1px solid var(--color-border); background:var(--color-bg-surface); color:var(--color-primary); font-size:var(--text-xs); font-weight:var(--font-weight-medium); cursor:pointer; white-space:nowrap;">查看全部</button>
      </div>

      <div style="display:flex; flex-direction:column; gap:var(--space-2);">

        <!-- Session 1: Running + pinned + unread -->
        <div style="display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3); border-radius:var(--radius-lg); background:var(--color-bg-surface); border:1px solid var(--color-border);">
          <div style="display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); background:var(--color-primary-muted); flex-shrink:0;">
            <i data-lucide="bot" style="width:18px; height:18px; color:var(--color-primary);"></i>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; align-items:center; gap:var(--space-2);">
              <span style="width:7px; height:7px; border-radius:50%; background:var(--color-primary); flex-shrink:0;"></span>
              <span style="font-size:var(--text-base); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">修复认证 bug</span>
            </div>
            <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">codex &middot; my-saas-app</span>
          </div>
          <div style="display:flex; align-items:center; gap:var(--space-2); flex-shrink:0;">
            <i data-lucide="pin" style="width:12px; height:12px; color:var(--color-text-muted);"></i>
            <span style="font-size:var(--text-xs); color:var(--color-primary); font-weight:var(--font-weight-medium); white-space:nowrap;">运行中</span>
          </div>
        </div>

        <!-- Session 2: Running + unread -->
        <div style="display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3); border-radius:var(--radius-lg); background:var(--color-bg-surface); border:1px solid var(--color-border);">
          <div style="display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); background:var(--color-primary-muted); flex-shrink:0;">
            <i data-lucide="sparkles" style="width:18px; height:18px; color:var(--color-primary);"></i>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; align-items:center; gap:var(--space-2);">
              <span style="width:7px; height:7px; border-radius:50%; background:var(--color-primary); flex-shrink:0;"></span>
              <span style="font-size:var(--text-base); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">添加暗色模式</span>
            </div>
            <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">claude &middot; portfolio-site</span>
          </div>
          <span style="font-size:var(--text-xs); color:var(--color-primary); font-weight:var(--font-weight-medium); white-space:nowrap; flex-shrink:0;">运行中</span>
        </div>

        <!-- Session 3: Completed + pinned -->
        <div style="display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3); border-radius:var(--radius-lg); background:var(--color-bg-surface); border:1px solid var(--color-border);">
          <div style="display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); background:var(--color-primary-muted); flex-shrink:0;">
            <i data-lucide="bot" style="width:18px; height:18px; color:var(--color-primary);"></i>
          </div>
          <div style="flex:1; min-width:0;">
            <span style="font-size:var(--text-base); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">重构 API</span>
            <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">codex &middot; my-saas-app</span>
          </div>
          <div style="display:flex; align-items:center; gap:var(--space-2); flex-shrink:0;">
            <i data-lucide="pin" style="width:12px; height:12px; color:var(--color-text-muted);"></i>
            <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap;">2h ago</span>
          </div>
        </div>

        <!-- Session 4: Completed + unread -->
        <div style="display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3); border-radius:var(--radius-lg); background:var(--color-bg-surface); border:1px solid var(--color-border);">
          <div style="display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); background:var(--color-primary-muted); flex-shrink:0;">
            <i data-lucide="cpu" style="width:18px; height:18px; color:var(--color-primary);"></i>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; align-items:center; gap:var(--space-2);">
              <span style="width:7px; height:7px; border-radius:50%; background:var(--color-primary); flex-shrink:0;"></span>
              <span style="font-size:var(--text-base); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">编写单元测试</span>
            </div>
            <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">gpt &middot; my-saas-app</span>
          </div>
          <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap; flex-shrink:0;">5h ago</span>
        </div>

        <!-- Session 5: Completed -->
        <div style="display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3); border-radius:var(--radius-lg); background:var(--color-bg-surface); border:1px solid var(--color-border);">
          <div style="display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-md); background:var(--color-primary-muted); flex-shrink:0;">
            <i data-lucide="zap" style="width:18px; height:18px; color:var(--color-primary);"></i>
          </div>
          <div style="flex:1; min-width:0;">
            <span style="font-size:var(--text-base); font-weight:var(--font-weight-semibold); color:var(--color-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">优化查询</span>
            <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">claude &middot; data-pipeline</span>
          </div>
          <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap; flex-shrink:0;">1d ago</span>
        </div>

      </div>
    </section>

  </main>

  <!-- Fixed Bottom Navigation -->
  <nav style="position:fixed; bottom:0; left:0; right:0; z-index:40; display:flex; align-items:center; justify-content:space-around; height:56px; background:var(--color-bg-surface); border-top:1px solid var(--color-border); padding-bottom:env(safe-area-inset-bottom, 0px);">
    <button style="display:flex; flex-direction:column; align-items:center; gap:2px; padding:var(--space-1); border:none; background:transparent; cursor:pointer;">
      <i data-lucide="layout-dashboard" style="width:20px; height:20px; color:var(--color-primary);"></i>
      <span style="font-size:var(--text-xs); font-weight:var(--font-weight-medium); color:var(--color-primary); white-space:nowrap;">工作台</span>
    </button>
    <button style="display:flex; flex-direction:column; align-items:center; gap:2px; padding:var(--space-1); border:none; background:transparent; cursor:pointer;">
      <i data-lucide="folder" style="width:20px; height:20px; color:var(--color-text-muted);"></i>
      <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap;">项目</span>
    </button>
    <button style="display:flex; flex-direction:column; align-items:center; gap:2px; padding:var(--space-1); border:none; background:transparent; cursor:pointer;">
      <i data-lucide="message-square" style="width:20px; height:20px; color:var(--color-text-muted);"></i>
      <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap;">会话</span>
    </button>
    <button style="display:flex; flex-direction:column; align-items:center; gap:2px; padding:var(--space-1); border:none; background:transparent; cursor:pointer;">
      <i data-lucide="scroll-text" style="width:20px; height:20px; color:var(--color-text-muted);"></i>
      <span style="font-size:var(--text-xs); color:var(--color-text-muted); white-space:nowrap;">日志</span>
    </button>
  </nav>

  <script>lucide.createIcons();</script>
</body>
</html>
