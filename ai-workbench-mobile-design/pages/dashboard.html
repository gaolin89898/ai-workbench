<!DOCTYPE html>
<html class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工作台 - 工作台</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="font-sans antialiased" style="font-family: var(--font-sans); background: var(--color-bg-app); color: var(--color-text-primary);">
  <main class="min-h-screen" style="padding: 14px 16px 86px;">
    <header class="flex items-center justify-between" style="padding: 6px 0 18px;">
      <div>
        <p style="font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: 4px;">欢迎回到 AI 工作台</p>
        <h1 style="font-size: 24px; line-height: 1.18; font-weight: var(--font-weight-bold); letter-spacing: -0.02em; color: var(--color-text-primary);">早上好，李明</h1>
      </div>
      <div class="flex items-center" style="gap: 10px;">
        <button aria-label="设置" class="flex items-center justify-center" style="width: 38px; height: 38px; border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-full); background: linear-gradient(135deg, #2563eb, #60a5fa); color: var(--color-text-inverse); font-size: var(--text-md); font-weight: var(--font-weight-bold); box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);">李</div>
      </div>
    </header>

    <section style="border-radius: 22px; padding: 18px; background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 55%, #60a5fa 100%); color: var(--color-text-inverse); box-shadow: 0 18px 36px rgba(37, 99, 235, 0.24); overflow: hidden; position: relative;">
      <div style="position: absolute; right: -42px; top: -48px; width: 132px; height: 132px; border-radius: var(--radius-full); background: rgba(255,255,255,0.16);"></div>
      <div style="position: absolute; right: 26px; bottom: -58px; width: 118px; height: 118px; border-radius: var(--radius-full); background: rgba(255,255,255,0.10);"></div>
      <div class="relative">
        <div class="flex items-start justify-between" style="gap: 16px;">
          <div class="min-w-0">
            <p style="font-size: var(--text-sm); opacity: 0.78; margin-bottom: 8px;">当前活动项目</p>
            <h2 class="truncate" style="font-size: 22px; line-height: var(--leading-tight); font-weight: var(--font-weight-bold); letter-spacing: -0.02em;">my-saas-app</h2>
          </div>
          <span class="shrink-0" style="font-size: var(--text-xs); font-weight: var(--font-weight-semibold); padding: 6px 9px; border-radius: var(--radius-full); background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.22);">运行中</span>
        </div>
        <div class="grid grid-cols-3" style="gap: 10px; margin-top: 20px;">
          <div style="border-radius: 16px; padding: 12px 10px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(10px);">
            <strong style="display: block; font-size: 24px; line-height: 1; font-weight: var(--font-weight-bold);">4</strong>
            <span style="display: block; margin-top: 7px; font-size: var(--text-xs); opacity: 0.78; white-space: nowrap;">活跃会话</span>
          </div>
          <div style="border-radius: 16px; padding: 12px 10px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(10px);">
            <strong style="display: block; font-size: 24px; line-height: 1; font-weight: var(--font-weight-bold);">28</strong>
            <span style="display: block; margin-top: 7px; font-size: var(--text-xs); opacity: 0.78; white-space: nowrap;">今日调用</span>
          </div>
          <div style="border-radius: 16px; padding: 12px 10px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(10px);">
            <strong style="display: block; font-size: 24px; line-height: 1; font-weight: var(--font-weight-bold);">2</strong>
            <span style="display: block; margin-top: 7px; font-size: var(--text-xs); opacity: 0.78; white-space: nowrap;">待处理</span>
          </div>
        </div>
      </div>
    </section>

    <section style="margin-top: 22px;">
      <div class="flex items-center justify-between" style="margin-bottom: 12px;">
        <h2 style="font-size: var(--text-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">快捷操作</h2>
        <span style="font-size: var(--text-sm); color: var(--color-text-muted);">常用工具</span>
      </div>
      <div class="grid grid-cols-4" style="gap: 10px;">
        <button class="flex flex-col items-center" style="gap: 9px; padding: 13px 6px; border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <span class="flex items-center justify-center" style="width: 38px; height: 38px; border-radius: 14px; background: var(--color-primary-muted); color: var(--color-primary);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
          <span style="font-size: var(--text-xs); font-weight: var(--font-weight-medium); color: var(--color-text-secondary); white-space: nowrap;">新建会话</span>
        </button>
        <button class="flex flex-col items-center" style="gap: 9px; padding: 13px 6px; border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <span class="flex items-center justify-center" style="width: 38px; height: 38px; border-radius: 14px; background: #ecfdf5; color: var(--state-success);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></span>
          <span style="font-size: var(--text-xs); font-weight: var(--font-weight-medium); color: var(--color-text-secondary); white-space: nowrap;">打开终端</span>
        </button>
        <button class="flex flex-col items-center" style="gap: 9px; padding: 13px 6px; border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <span class="flex items-center justify-center" style="width: 38px; height: 38px; border-radius: 14px; background: #fff7ed; color: var(--state-warning);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
          <span style="font-size: var(--text-xs); font-weight: var(--font-weight-medium); color: var(--color-text-secondary); white-space: nowrap;">查看日志</span>
        </button>
        <button class="flex flex-col items-center" style="gap: 9px; padding: 13px 6px; border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <span class="flex items-center justify-center" style="width: 38px; height: 38px; border-radius: 14px; background: #f0f9ff; color: var(--state-info);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-15-6.7L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/><path d="M21 21v-5h-5"/></svg></span>
          <span style="font-size: var(--text-xs); font-weight: var(--font-weight-medium); color: var(--color-text-secondary); white-space: nowrap;">同步项目</span>
        </button>
      </div>
    </section>

    <section style="margin-top: 24px;">
      <div class="flex items-center justify-between" style="margin-bottom: 12px;">
        <h2 style="font-size: var(--text-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">最近会话</h2>
        <button style="font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-primary);">查看全部</button>
      </div>
      <div style="border: 1px solid var(--color-border); border-radius: 20px; background: var(--color-bg-surface); box-shadow: var(--shadow-card); overflow: hidden;">
        <article class="flex items-center" style="gap: 12px; padding: 15px; border-bottom: 1px solid #edf2f7;">
          <div class="shrink-0 flex items-center justify-center" style="width: 42px; height: 42px; border-radius: 15px; background: #fef2f2; color: var(--state-error);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="16" height="16" x="4" y="4" rx="2"/><path d="M9 14h6"/><path d="M12 11v6"/></svg></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center" style="gap: 8px;">
              <h3 class="truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">修复认证 bug</h3>
              <span class="shrink-0" style="font-size: 10px; padding: 3px 7px; border-radius: var(--radius-full); background: #fef2f2; color: var(--state-error); font-weight: var(--font-weight-semibold);">待处理</span>
            </div>
            <p class="truncate" style="margin-top: 4px; font-size: var(--text-sm); color: var(--color-text-muted);">定位登录态失效问题 · 8 分钟前</p>
          </div>
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </article>
        <article class="flex items-center" style="gap: 12px; padding: 15px; border-bottom: 1px solid #edf2f7;">
          <div class="shrink-0 flex items-center justify-center" style="width: 42px; height: 42px; border-radius: 15px; background: #eff6ff; color: var(--color-primary);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center" style="gap: 8px;">
              <h3 class="truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">优化 API 性能</h3>
              <span class="shrink-0" style="font-size: 10px; padding: 3px 7px; border-radius: var(--radius-full); background: #fff7ed; color: var(--state-warning); font-weight: var(--font-weight-semibold);">进行中</span>
            </div>
            <p class="truncate" style="margin-top: 4px; font-size: var(--text-sm); color: var(--color-text-muted);">分析慢查询与接口耗时 · 26 分钟前</p>
          </div>
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </article>
        <article class="flex items-center" style="gap: 12px; padding: 15px;">
          <div class="shrink-0 flex items-center justify-center" style="width: 42px; height: 42px; border-radius: 15px; background: #ecfdf5; color: var(--state-success);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center" style="gap: 8px;">
              <h3 class="truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">重构数据库查询</h3>
              <span class="shrink-0" style="font-size: 10px; padding: 3px 7px; border-radius: var(--radius-full); background: #ecfdf5; color: var(--state-success); font-weight: var(--font-weight-semibold);">已完成</span>
            </div>
            <p class="truncate" style="margin-top: 4px; font-size: var(--text-sm); color: var(--color-text-muted);">抽取数据访问层并补充索引 · 1 小时前</p>
          </div>
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </article>
      </div>
    </section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-30" style="height: 66px; background: rgba(255,255,255,0.94); border-top: 1px solid var(--color-border); backdrop-filter: blur(18px); padding-bottom: env(safe-area-inset-bottom);">
    <div class="grid grid-cols-4 h-full" style="max-width: 480px; margin: 0 auto;">
      <a class="flex flex-col items-center justify-center" style="gap: 4px; color: var(--color-primary);" href="#">
        <span class="flex items-center justify-center" style="width: 26px; height: 26px; border-radius: 10px; background: var(--color-primary-muted);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span style="font-size: 10px; font-weight: var(--font-weight-semibold);">工作台</span>
      </a>
      <a class="flex flex-col items-center justify-center" style="gap: 4px; color: var(--color-text-muted);" href="#">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span style="font-size: 10px; font-weight: var(--font-weight-medium);">会话</span>
      </a>
      <a class="flex flex-col items-center justify-center" style="gap: 4px; color: var(--color-text-muted);" href="#">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span style="font-size: 10px; font-weight: var(--font-weight-medium);">关于</span>
      </a>
      <a class="flex flex-col items-center justify-center" style="gap: 4px; color: var(--color-text-muted);" href="#">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span style="font-size: 10px; font-weight: var(--font-weight-medium);">设置</span>
      </a>
    </div>
  </nav>
</body>
</html>
