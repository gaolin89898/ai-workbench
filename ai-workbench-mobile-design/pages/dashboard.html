<!DOCTYPE html>
<html class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台 - AI Workbench</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="font-sans antialiased" style="font-family: var(--font-sans); background: #f6f8fb;">
  <main class="min-h-screen pb-20">
    <!-- Header -->
    <div class="sticky top-0 z-20 bg-white border-b" style="border-bottom: 1px solid #eceff3;">
      <div class="flex items-center justify-between px-4" style="height: 56px;">
        <h1 class="font-semibold truncate" style="font-size: 17px; font-weight: 600; color: #0f172a;">工作台</h1>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background: #eff6ff;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background: #f8fafc; border: 1px solid #e5e7eb;">
            <span style="font-size: 12px; font-weight: 600; color: #475569;">李</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Metric Summary Strip -->
    <div class="px-4 pt-4">
      <div class="grid grid-cols-3 gap-2.5">
        <!-- Metric 1 -->
        <div class="border flex flex-col justify-center items-center text-center" style="border: 1px solid #e5e7eb; border-radius: 8px; background: #f8fafc; min-height: 70px;">
          <span class="whitespace-nowrap" style="font-size: 22px; font-weight: 700; color: #0f172a;">12</span>
          <span class="truncate mt-0.5" style="font-size: 11px; color: #94a3b8;">活跃设备</span>
        </div>
        <!-- Metric 2 -->
        <div class="border flex flex-col justify-center items-center text-center" style="border: 1px solid #e5e7eb; border-radius: 8px; background: #f8fafc; min-height: 70px;">
          <span class="whitespace-nowrap" style="font-size: 22px; font-weight: 700; color: #0f172a;">48</span>
          <span class="truncate mt-0.5" style="font-size: 11px; color: #94a3b8;">今日会话</span>
        </div>
        <!-- Metric 3 -->
        <div class="border flex flex-col justify-center items-center text-center" style="border: 1px solid #e5e7eb; border-radius: 8px; background: #f8fafc; min-height: 70px;">
          <span class="whitespace-nowrap" style="font-size: 22px; font-weight: 700; color: #0f172a;">99%</span>
          <span class="truncate mt-0.5" style="font-size: 11px; color: #94a3b8;">可用率</span>
        </div>
      </div>
    </div>

    <!-- Session List -->
    <div class="px-4 pt-5">
      <h2 class="mb-3" style="font-size: 15px; font-weight: 600; color: #0f172a;">最近会话</h2>
      <div class="border overflow-hidden" style="border: 1px solid #e5e7eb; border-radius: 8px; background: #ffffff;">
        <!-- Session 1 -->
        <div class="flex items-center gap-3" style="min-height: 72px; padding: 12px 14px; border-bottom: 1px solid #eceff3;">
          <div class="shrink-0 w-9 h-9 rounded-lg flex items-center justify-center" style="background: #eff6ff; border-radius: 7px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="truncate" style="font-size: 14px; font-weight: 500; color: #0f172a;">代码重构建议</span>
              <span class="shrink-0 inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #ecfdf5; color: #22c55e; border-radius: 7px;">已完成</span>
            </div>
            <p class="truncate mt-0.5" style="font-size: 12px; color: #94a3b8;">GPT-4o · 3分钟前</p>
          </div>
        </div>

        <!-- Session 2 -->
        <div class="flex items-center gap-3" style="min-height: 72px; padding: 12px 14px; border-bottom: 1px solid #eceff3;">
          <div class="shrink-0 w-9 h-9 rounded-lg flex items-center justify-center" style="background: #fff7ed; border-radius: 7px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="truncate" style="font-size: 14px; font-weight: 500; color: #0f172a;">性能优化分析</span>
              <span class="shrink-0 inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #fff7ed; color: #f59e0b; border-radius: 7px;">进行中</span>
            </div>
            <p class="truncate mt-0.5" style="font-size: 12px; color: #94a3b8;">Claude 3.5 · 15分钟前</p>
          </div>
        </div>

        <!-- Session 3 -->
        <div class="flex items-center gap-3" style="min-height: 72px; padding: 12px 14px; border-bottom: 1px solid #eceff3;">
          <div class="shrink-0 w-9 h-9 rounded-lg flex items-center justify-center" style="background: #eff6ff; border-radius: 7px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="truncate" style="font-size: 14px; font-weight: 500; color: #0f172a;">API 接口调试</span>
              <span class="shrink-0 inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #fef2f2; color: #ef4444; border-radius: 7px;">已失败</span>
            </div>
            <p class="truncate mt-0.5" style="font-size: 12px; color: #94a3b8;">GPT-4o · 1小时前</p>
          </div>
        </div>

        <!-- Session 4 -->
        <div class="flex items-center gap-3" style="min-height: 72px; padding: 12px 14px; border-bottom: 1px solid #eceff3;">
          <div class="shrink-0 w-9 h-9 rounded-lg flex items-center justify-center" style="background: #ecfdf5; border-radius: 7px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="truncate" style="font-size: 14px; font-weight: 500; color: #0f172a;">前端组件生成</span>
              <span class="shrink-0 inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #ecfdf5; color: #22c55e; border-radius: 7px;">已完成</span>
            </div>
            <p class="truncate mt-0.5" style="font-size: 12px; color: #94a3b8;">Claude 3.5 · 2小时前</p>
          </div>
        </div>

        <!-- Session 5 -->
        <div class="flex items-center gap-3" style="min-height: 72px; padding: 12px 14px;">
          <div class="shrink-0 w-9 h-9 rounded-lg flex items-center justify-center" style="background: #eff6ff; border-radius: 7px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="truncate" style="font-size: 14px; font-weight: 500; color: #0f172a;">数据库迁移方案</span>
              <span class="shrink-0 inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #eff6ff; color: #2563eb; border-radius: 7px;">等待中</span>
            </div>
            <p class="truncate mt-0.5" style="font-size: 12px; color: #94a3b8;">GPT-4o · 昨天</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Fixed Bottom Nav -->
  <div class="fixed bottom-0 left-0 right-0 z-30 bg-white border-t flex items-center justify-around" style="height: 56px; border-top: 1px solid #eceff3;">
    <!-- Active Tab -->
    <div class="flex flex-col items-center gap-0.5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: #2563eb;">工作台</span>
    </div>
    <div class="flex flex-col items-center gap-0.5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #94a3b8;">项目</span>
    </div>
    <div class="flex flex-col items-center gap-0.5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #94a3b8;">会话</span>
    </div>
    <div class="flex flex-col items-center gap-0.5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #94a3b8;">日志</span>
    </div>
  </div>
</body>
</html>
