<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工作台 - 登录</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-app); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin: 0; min-height: 100vh; font-family: var(--font-sans); background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.12) 0, rgba(37, 99, 235, 0.04) 250px, transparent 430px), var(--color-bg-app); color: var(--color-text-primary);">
  <main style="width: 390px; min-height: 844px; margin: 0 auto; display: flex; flex-direction: column; box-sizing: border-box; padding: 54px 22px 18px; position: relative; overflow: hidden;">
    <section style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 28px;">
      <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 32px;">
        <div style="width: 66px; height: 66px; border-radius: 20px; background: linear-gradient(135deg, var(--color-primary), #60a5fa); display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 36px rgba(37, 99, 235, 0.24); margin-bottom: 18px;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3L4 7.2l8 4.2 8-4.2L12 3Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M4 12l8 4.2 8-4.2" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>
            <path d="M4 16.6l8 4.2 8-4.2" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.66"/>
          </svg>
        </div>
        <h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 800; letter-spacing: -0.04em; color: var(--color-text-primary);">AI 工作台</h1>
        <p style="margin: 10px 0 0; max-width: 286px; text-align: center; font-size: 14px; line-height: 1.65; color: var(--color-text-secondary);">登录后继续管理你的设备、会话与 AI 工具配置</p>
      </div>

      <form style="background: rgba(255, 255, 255, 0.92); border: 1px solid var(--color-border); border-radius: 24px; padding: 22px; box-shadow: var(--shadow-elevated); backdrop-filter: blur(16px);" action="#" method="post">
        <div style="margin-bottom: 16px;">
          <label for="account" style="display: block; margin-bottom: 8px; font-size: 13px; line-height: 1.4; font-weight: 650; color: var(--color-text-secondary);">账号</label>
          <input id="account" name="account" type="text" placeholder="输入手机号或邮箱" autocomplete="username" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid var(--color-border); border-radius: 14px; background: var(--color-bg-input); padding: 0 15px; outline: none; font-family: var(--font-sans); font-size: 15px; color: var(--color-text-primary); box-shadow: inset 0 1px 0 rgba(255,255,255,0.78);">
        </div>

        <div style="margin-bottom: 18px;">
          <label for="password" style="display: block; margin-bottom: 8px; font-size: 13px; line-height: 1.4; font-weight: 650; color: var(--color-text-secondary);">密码</label>
          <input id="password" name="password" type="password" placeholder="输入密码" autocomplete="current-password" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid var(--color-border); border-radius: 14px; background: var(--color-bg-input); padding: 0 15px; outline: none; font-family: var(--font-sans); font-size: 15px; color: var(--color-text-primary); box-shadow: inset 0 1px 0 rgba(255,255,255,0.78);">
        </div>

        <button type="submit" style="width: 100%; height: 50px; border: 0; border-radius: 16px; background: linear-gradient(135deg, var(--color-primary), #3b82f6); color: var(--color-text-inverse); font-family: var(--font-sans); font-size: 15px; font-weight: 750; letter-spacing: 0.01em; box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25); cursor: pointer;">继续使用</button>

        <p style="margin: 14px 0 0; text-align: center; font-size: 12px; line-height: 1.5; color: var(--color-text-muted);">首次使用将自动创建账号</p>
      </form>

      <aside style="margin-top: 16px; display: flex; gap: 11px; align-items: flex-start; padding: 14px 15px; border: 1px solid rgba(37, 99, 235, 0.16); border-radius: 18px; background: var(--color-primary-soft);">
        <div style="width: 28px; height: 28px; flex: 0 0 auto; border-radius: 10px; background: var(--color-primary-muted); color: var(--color-primary); display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div style="min-width: 0;">
          <strong style="display: block; margin-bottom: 3px; font-size: 13px; line-height: 1.35; font-weight: 750; color: var(--color-text-primary);">安全同步</strong>
          <p style="margin: 0; font-size: 12px; line-height: 1.55; color: var(--color-text-secondary);">本地会话与工具配置会在设备间同步。</p>
        </div>
      </aside>
    </section>

    <footer style="text-align: center; font-size: 11px; line-height: 1.5; color: var(--color-text-muted);">v0.3.2</footer>
  </main>
  <script>if (window.lucide) { lucide.createIcons(); }</script>
</body>
</html>
