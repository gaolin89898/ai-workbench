<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin:0; padding:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--font-sans);">

  <main style="width:100%; max-width:390px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:var(--space-6); background:linear-gradient(180deg, #dbeafe 0%, #eff6ff 30%, #f8fafc 100%);">

    <!-- Branding Area -->
    <div style="text-align:center; margin-bottom:var(--space-10);">
      <!-- CSS-only 3x3 grid app icon (64px) -->
      <div style="width:64px; height:64px; margin:0 auto var(--space-5); display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:4px;">
        <div style="background:var(--color-primary); border-radius:var(--radius-md);"></div>
        <div style="background:rgba(37,99,235,0.25); border-radius:var(--radius-md);"></div>
        <div style="background:var(--color-primary); border-radius:var(--radius-md);"></div>
        <div style="background:rgba(37,99,235,0.25); border-radius:var(--radius-md);"></div>
        <div style="background:var(--color-primary); border-radius:var(--radius-md);"></div>
        <div style="background:rgba(37,99,235,0.25); border-radius:var(--radius-md);"></div>
        <div style="background:var(--color-primary); border-radius:var(--radius-md);"></div>
        <div style="background:rgba(37,99,235,0.25); border-radius:var(--radius-md);"></div>
        <div style="background:var(--color-primary); border-radius:var(--radius-md);"></div>
      </div>
      <h1 style="font-size:24px; font-weight:var(--font-weight-bold); color:var(--color-text-primary); margin:0 0 var(--space-2); line-height:var(--leading-tight); text-wrap:balance; word-break:keep-all; overflow-wrap:break-word;">AI 工作台</h1>
      <p style="font-size:var(--text-sm); color:var(--color-text-muted); margin:0; line-height:var(--leading-normal);">连接你的桌面 AI 工作台</p>
    </div>

    <!-- Login Card (sliding up from bottom feel) -->
    <div style="width:100%; background:var(--color-bg-surface); border-radius:16px; padding:var(--space-6); box-shadow:var(--shadow-elevated);">

      <!-- Server Address -->
      <div style="margin-bottom:var(--space-4);">
        <label for="server-address" style="display:block; font-size:var(--text-sm); font-weight:var(--font-weight-medium); color:var(--color-text-secondary); margin-bottom:var(--space-1);">服务器地址</label>
        <input
          id="server-address"
          type="url"
          placeholder="http://"
          style="width:100%; height:44px; padding:0 var(--space-3); background:var(--color-bg-input); border:1px solid var(--color-border); border-radius:var(--radius-md); font-size:var(--text-md); font-family:var(--font-mono); color:var(--color-text-primary); outline:none; box-sizing:border-box;"
        />
      </div>

      <!-- Email -->
      <div style="margin-bottom:var(--space-4);">
        <label for="email" style="display:block; font-size:var(--text-sm); font-weight:var(--font-weight-medium); color:var(--color-text-secondary); margin-bottom:var(--space-1);">邮箱</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          style="width:100%; height:44px; padding:0 var(--space-3); background:var(--color-bg-input); border:1px solid var(--color-border); border-radius:var(--radius-md); font-size:var(--text-md); font-family:var(--font-sans); color:var(--color-text-primary); outline:none; box-sizing:border-box;"
        />
      </div>

      <!-- Password with eye toggle -->
      <div style="margin-bottom:var(--space-5);">
        <label for="password" style="display:block; font-size:var(--text-sm); font-weight:var(--font-weight-medium); color:var(--color-text-secondary); margin-bottom:var(--space-1);">密码</label>
        <div style="position:relative;">
          <input
            id="password"
            type="password"
            placeholder="输入密码"
            style="width:100%; height:44px; padding:0 var(--space-10) 0 var(--space-3); background:var(--color-bg-input); border:1px solid var(--color-border); border-radius:var(--radius-md); font-size:var(--text-md); font-family:var(--font-sans); color:var(--color-text-primary); outline:none; box-sizing:border-box;"
          />
          <button
            type="button"
            aria-label="Toggle password visibility"
            style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; padding:4px; cursor:pointer; color:var(--color-text-muted); display:flex; align-items:center; justify-content:center;"
          >
            <i data-lucide="eye" style="width:18px; height:18px;"></i>
          </button>
        </div>
      </div>

      <!-- Primary CTA -->
      <button
        type="button"
        style="width:100%; height:48px; background:var(--color-primary); color:var(--color-text-inverse); border:none; border-radius:var(--radius-md); font-size:var(--text-md); font-weight:var(--font-weight-semibold); font-family:var(--font-sans); cursor:pointer; display:flex; align-items:center; justify-content:center; whitespace:nowrap;"
      >
        登录并进入工作台
      </button>
    </div>

    <!-- Footer -->
    <p style="margin-top:var(--space-8); font-size:var(--text-xs); color:var(--color-text-muted); text-align:center;">v0.3.2</p>

  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
