<!DOCTYPE html>
<html class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI Workbench</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="font-sans antialiased" style="font-family: var(--font-sans); background: #f6f8fb;">
  <main class="min-h-screen flex items-center justify-center px-5">
    <div class="w-full max-w-sm">
      <!-- Card -->
      <div class="rounded-lg border border-[#e2e8f0] bg-white overflow-hidden" style="border-radius: 8px;">
        <!-- Blue top accent -->
        <div class="h-[2px] w-full" style="background: #2563eb;"></div>
        <div class="px-7 pt-8 pb-7">
          <!-- Logo / Brand -->
          <div class="flex items-center justify-center gap-2 mb-7">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: #2563eb; border-radius: 7px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </div>
            <span class="text-base font-semibold" style="font-size: 16px; font-weight: 600; color: #0f172a;">AI Workbench</span>
          </div>

          <h1 class="text-center mb-1" style="font-size: 20px; font-weight: 700; color: #0f172a;">欢迎回来</h1>
          <p class="text-center mb-6" style="font-size: 13px; color: #94a3b8;">登录到你的工作空间</p>

          <!-- Server Address -->
          <div class="mb-4">
            <label class="block mb-1.5" style="font-size: 13px; font-weight: 500; color: #475569;">服务器地址</label>
            <input type="text" placeholder="https://your-server.com" class="w-full outline-none transition-colors" style="height: 42px; border: 1px solid #cbd5e1; border-radius: 7px; background: #f8fafc; padding: 0 12px; font-size: 13px; color: #0f172a; font-family: var(--font-sans);">
          </div>

          <!-- Email -->
          <div class="mb-4">
            <label class="block mb-1.5" style="font-size: 13px; font-weight: 500; color: #475569;">邮箱</label>
            <input type="email" placeholder="your@email.com" class="w-full outline-none transition-colors" style="height: 42px; border: 1px solid #cbd5e1; border-radius: 7px; background: #f8fafc; padding: 0 12px; font-size: 13px; color: #0f172a; font-family: var(--font-sans);">
          </div>

          <!-- Password -->
          <div class="mb-6">
            <label class="block mb-1.5" style="font-size: 13px; font-weight: 500; color: #475569;">密码</label>
            <input type="password" placeholder="输入密码" class="w-full outline-none transition-colors" style="height: 42px; border: 1px solid #cbd5e1; border-radius: 7px; background: #f8fafc; padding: 0 12px; font-size: 13px; color: #0f172a; font-family: var(--font-sans);">
          </div>

          <!-- Login Button -->
          <button class="w-full text-white font-medium transition-colors" style="height: 42px; background: #2563eb; border-radius: 7px; font-size: 14px; font-weight: 500; border: none; cursor: pointer;">
            登录
          </button>

          <!-- Forgot -->
          <p class="text-center mt-4" style="font-size: 12px; color: #94a3b8;">
            忘记密码？<a href="#" style="color: #2563eb; text-decoration: none;">重置密码</a>
          </p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
