<!DOCTYPE html>
<html class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工作台 - 设置</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      button { font: inherit; -webkit-tap-highlight-color: transparent; }
      .settings-card {
        border: 1px solid var(--color-border);
        border-radius: 22px;
        background: var(--color-bg-surface);
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }
      .menu-row {
        min-height: 58px;
        padding: 0 16px;
        border-bottom: 1px solid #edf2f7;
      }
      .menu-row:last-child { border-bottom: 0; }
      .icon-box {
        width: 38px;
        height: 38px;
        border-radius: 14px;
      }
      .switch {
        width: 46px;
        height: 26px;
        border-radius: var(--radius-full);
        position: relative;
        flex: 0 0 auto;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        width: 20px;
        height: 20px;
        border-radius: var(--radius-full);
        background: #ffffff;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.18);
      }
      .switch.on { background: var(--color-primary); }
      .switch.on::after { right: 3px; }
      .switch.off { background: #cbd5e1; }
      .switch.off::after { left: 3px; }
      .bottom-nav {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 30;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        padding: 8px;
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(18px);
      }
      .nav-item {
        min-width: 0;
        border: 0;
        border-radius: 18px;
        background: transparent;
        color: var(--color-text-muted);
        padding: 8px 4px 7px;
      }
      .nav-item.active {
        color: var(--color-primary);
        background: var(--color-primary-soft);
      }
    </style>
</head>
<body class="font-sans antialiased" style="font-family: var(--font-sans); background: var(--color-bg-app); color: var(--color-text-primary);">
  <main class="min-h-screen" style="padding: 14px 16px 100px;">
    <header class="flex items-center justify-between" style="padding: 6px 0 18px;">
      <div>
        <p style="font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: 4px;">账户与偏好</p>
        <h1 style="font-size: 28px; line-height: 1.15; font-weight: var(--font-weight-bold); letter-spacing: -0.03em; color: var(--color-text-primary);">设置</h1>
      </div>
      <button aria-label="搜索设置" class="flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-bg-surface); color: var(--color-text-secondary); box-shadow: var(--shadow-card);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </header>

    <section class="settings-card" style="padding: 16px; border-radius: 24px; background: linear-gradient(135deg, #ffffff 0%, #eff6ff 100%);">
      <div class="flex items-center" style="gap: 14px;">
        <div class="flex items-center justify-center shrink-0" style="width: 58px; height: 58px; border-radius: 22px; background: linear-gradient(135deg, #2563eb, #60a5fa); color: var(--color-text-inverse); font-size: 20px; font-weight: var(--font-weight-bold); box-shadow: 0 12px 22px rgba(37, 99, 235, 0.24);">李</div>
        <div class="min-w-0 flex-1">
          <h2 class="truncate" style="font-size: var(--text-lg); line-height: var(--leading-tight); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">李明</h2>
          <p class="truncate" style="margin-top: 5px; font-size: var(--text-md); color: var(--color-text-secondary);">li@workbench.ai</p>
        </div>
        <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </section>

    <section style="margin-top: 22px;">
      <h2 style="margin: 0 0 10px 2px; font-size: var(--text-sm); font-weight: var(--font-weight-semibold); color: var(--color-text-muted);">菜单</h2>
      <div class="settings-card">
        <button class="menu-row flex items-center w-full text-left" style="gap: 13px; background: transparent; color: inherit; border-left: 0; border-right: 0; border-top: 0;">
          <span class="icon-box flex items-center justify-center shrink-0" style="background: var(--color-primary-muted); color: var(--color-primary);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
          <span class="flex-1 truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">连接</span>
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="menu-row flex items-center w-full text-left" style="gap: 13px; background: transparent; color: inherit; border-left: 0; border-right: 0; border-top: 0;">
          <span class="icon-box flex items-center justify-center shrink-0" style="background: #ecfdf5; color: var(--state-success);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></span>
          <span class="flex-1 truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">安全与历史</span>
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="menu-row flex items-center w-full text-left" style="gap: 13px; background: transparent; color: inherit; border-left: 0; border-right: 0; border-top: 0;">
          <span class="icon-box flex items-center justify-center shrink-0" style="background: #fff7ed; color: var(--state-warning);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/><path d="M8 6h8"/></svg></span>
          <span class="flex-1 truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">设备配对</span>
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="menu-row flex items-center w-full text-left" style="gap: 13px; background: transparent; color: inherit; border-left: 0; border-right: 0; border-top: 0;">
          <span class="icon-box flex items-center justify-center shrink-0" style="background: #f1f5f9; color: var(--color-text-secondary);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg></span>
          <span class="flex-1 truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">已归档对话</span>
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </section>

    <section style="margin-top: 22px;">
      <h2 style="margin: 0 0 10px 2px; font-size: var(--text-sm); font-weight: var(--font-weight-semibold); color: var(--color-text-muted);">偏好</h2>
      <div class="settings-card">
        <div class="menu-row flex items-center" style="gap: 13px;">
          <span class="icon-box flex items-center justify-center shrink-0" style="background: #eef2ff; color: #4f46e5;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
          <span class="flex-1 truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">跟随系统主题</span>
          <span class="switch on" aria-hidden="true"></span>
        </div>
        <div class="menu-row flex items-center" style="gap: 13px;">
          <span class="icon-box flex items-center justify-center shrink-0" style="background: #ecfeff; color: #0891b2;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-15-6.7L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/><path d="M21 21v-5h-5"/></svg></span>
          <span class="flex-1 truncate" style="font-size: var(--text-md); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">自动同步会话</span>
          <span class="switch on" aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <section style="margin-top: 22px;">
      <button class="w-full flex items-center justify-center" style="height: 50px; border: 1px solid #fecaca; border-radius: 18px; background: #ffffff; color: var(--state-error); font-size: var(--text-md); font-weight: var(--font-weight-semibold); box-shadow: var(--shadow-card);">退出登录</button>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="底部导航">
    <button class="nav-item flex flex-col items-center" style="gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      <span style="font-size: var(--text-xs); font-weight: var(--font-weight-semibold);">工作台</span>
    </button>
    <button class="nav-item flex flex-col items-center" style="gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
      <span style="font-size: var(--text-xs); font-weight: var(--font-weight-semibold);">会话</span>
    </button>
    <button class="nav-item flex flex-col items-center" style="gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span style="font-size: var(--text-xs); font-weight: var(--font-weight-semibold);">关于</span>
    </button>
    <button class="nav-item active flex flex-col items-center" style="gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <span style="font-size: var(--text-xs); font-weight: var(--font-weight-semibold);">设置</span>
    </button>
  </nav>
</body>
</html>
