<!DOCTYPE html>
<html class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - AI Workbench</title>
    <style id="theme-vars">
/* AI Workbench Mobile — Light Task-Oriented Theme */
/* Inspired by Trae Work clean aesthetic */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);

  /* Surface & Background */
  --color-bg-app: #f8fafc;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #f8fafc;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #f1f5f9;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  --color-bg-active: rgba(37, 99, 235, 0.08);

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-secondary: #475569;
  --color-text-muted: #94a3b8;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e2e8f0;
  --color-border-active: rgba(37, 99, 235, 0.4);

  /* State Colors */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Shadow */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="font-sans antialiased" style="font-family: var(--font-sans); background: #f6f8fb;">
  <main class="min-h-screen pb-6">
    <!-- Header -->
    <div class="sticky top-0 z-20 bg-white border-b" style="border-bottom: 1px solid #eceff3;">
      <div class="flex items-center justify-between px-4" style="height: 56px;">
        <div class="flex items-center gap-2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </div>
        <h1 class="font-semibold truncate" style="font-size: 17px; font-weight: 600; color: #0f172a;">设置</h1>
        <div class="w-5"></div>
      </div>
    </div>

    <!-- Settings Content -->
    <div class="px-4 pt-5">

      <!-- Section: Account -->
      <h2 class="mb-2 px-1" style="font-size: 12px; font-weight: 650; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;">账户</h2>
      <div class="overflow-hidden mb-5" style="border-radius: 8px; background: #ffffff;">
        <!-- Row 1 -->
        <div class="flex items-center justify-between px-4" style="height: 52px; border-bottom: 1px solid #eceff3;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">头像</span>
          <div class="flex items-center gap-2 shrink-0">
            <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background: #eff6ff; border: 1px solid #e2e8f0;">
              <span style="font-size: 12px; font-weight: 600; color: #2563eb;">李</span>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
        <!-- Row 2 -->
        <div class="flex items-center justify-between px-4" style="height: 52px; border-bottom: 1px solid #eceff3;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">用户名</span>
          <div class="flex items-center gap-2 shrink-0">
            <span class="truncate" style="font-size: 13px; color: #94a3b8;">李明</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
        <!-- Row 3 -->
        <div class="flex items-center justify-between px-4" style="height: 52px;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">邮箱</span>
          <div class="flex items-center gap-2 shrink-0">
            <span class="truncate" style="font-size: 13px; color: #94a3b8;">li@workbench.ai</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
      </div>

      <!-- Section: General -->
      <h2 class="mb-2 px-1" style="font-size: 12px; font-weight: 650; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;">通用</h2>
      <div class="overflow-hidden mb-5" style="border-radius: 8px; background: #ffffff;">
        <!-- Row 1: Language -->
        <div class="flex items-center justify-between px-4" style="height: 52px; border-bottom: 1px solid #eceff3;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">语言</span>
          <div class="flex items-center gap-2 shrink-0">
            <span class="truncate" style="font-size: 13px; color: #94a3b8;">简体中文</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
        <!-- Row 2: Theme -->
        <div class="flex items-center justify-between px-4" style="height: 52px; border-bottom: 1px solid #eceff3;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">主题</span>
          <div class="flex items-center gap-2 shrink-0">
            <span class="truncate" style="font-size: 13px; color: #94a3b8;">浅色</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
        <!-- Row 3: Font Size -->
        <div class="flex items-center justify-between px-4" style="height: 52px;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">字体大小</span>
          <div class="flex items-center gap-2 shrink-0">
            <span class="truncate" style="font-size: 13px; color: #94a3b8;">标准</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
      </div>

      <!-- Section: Notifications -->
      <h2 class="mb-2 px-1" style="font-size: 12px; font-weight: 650; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;">通知</h2>
      <div class="overflow-hidden mb-5" style="border-radius: 8px; background: #ffffff;">
        <!-- Row 1: Push Notifications -->
        <div class="flex items-center justify-between px-4" style="height: 52px; border-bottom: 1px solid #eceff3;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">推送通知</span>
          <!-- Toggle ON -->
          <div style="width: 40px; height: 22px; background: #2563eb; border-radius: 11px; position: relative; cursor: pointer;">
            <div style="width: 18px; height: 18px; background: #ffffff; border-radius: 50%; position: absolute; top: 2px; right: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);"></div>
          </div>
        </div>
        <!-- Row 2: Sound -->
        <div class="flex items-center justify-between px-4" style="height: 52px; border-bottom: 1px solid #eceff3;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">提示音</span>
          <!-- Toggle ON -->
          <div style="width: 40px; height: 22px; background: #2563eb; border-radius: 11px; position: relative; cursor: pointer;">
            <div style="width: 18px; height: 18px; background: #ffffff; border-radius: 50%; position: absolute; top: 2px; right: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);"></div>
          </div>
        </div>
        <!-- Row 3: Email Notifications -->
        <div class="flex items-center justify-between px-4" style="height: 52px;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">邮件通知</span>
          <!-- Toggle OFF -->
          <div style="width: 40px; height: 22px; background: #cbd5e1; border-radius: 11px; position: relative; cursor: pointer;">
            <div style="width: 18px; height: 18px; background: #ffffff; border-radius: 50%; position: absolute; top: 2px; left: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);"></div>
          </div>
        </div>
      </div>

      <!-- Section: Security -->
      <h2 class="mb-2 px-1" style="font-size: 12px; font-weight: 650; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;">安全</h2>
      <div class="overflow-hidden mb-5" style="border-radius: 8px; background: #ffffff;">
        <!-- Row 1 -->
        <div class="flex items-center justify-between px-4" style="height: 52px; border-bottom: 1px solid #eceff3;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">修改密码</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <!-- Row 2 -->
        <div class="flex items-center justify-between px-4" style="height: 52px; border-bottom: 1px solid #eceff3;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">双因素认证</span>
          <div class="flex items-center gap-2 shrink-0">
            <span class="shrink-0 inline-flex items-center px-1.5 py-0.5 whitespace-nowrap" style="font-size: 10px; font-weight: 500; background: #ecfdf5; color: #22c55e; border-radius: 7px;">已开启</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
        <!-- Row 3 -->
        <div class="flex items-center justify-between px-4" style="height: 52px;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">登录设备管理</span>
          <div class="flex items-center gap-2 shrink-0">
            <span class="truncate" style="font-size: 13px; color: #94a3b8;">3 台设备</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
      </div>

      <!-- Section: About -->
      <h2 class="mb-2 px-1" style="font-size: 12px; font-weight: 650; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;">关于</h2>
      <div class="overflow-hidden" style="border-radius: 8px; background: #ffffff;">
        <!-- Row 1 -->
        <div class="flex items-center justify-between px-4" style="height: 52px; border-bottom: 1px solid #eceff3;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">版本</span>
          <span class="shrink-0" style="font-size: 13px; color: #94a3b8;">v1.2.0</span>
        </div>
        <!-- Row 2 -->
        <div class="flex items-center justify-between px-4" style="height: 52px;">
          <span class="truncate" style="font-size: 14px; color: #0f172a;">服务条款</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>

      <!-- Logout -->
      <div class="mt-6">
        <button class="w-full flex items-center justify-center" style="height: 48px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; font-size: 14px; font-weight: 500; color: #ef4444; cursor: pointer;">
          退出登录
        </button>
      </div>
    </div>
  </main>
</body>
</html>
