name: Release Server

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go mod download
          go build -o ai-workbench-server ./cmd/server
          tar -czf ai-workbench-server-linux-amd64.tar.gz ai-workbench-server migrations/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: backend/ai-workbench-server-linux-amd64.tar.gz
