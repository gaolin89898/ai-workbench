name: Release desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            package-script: package:win
            artifact-name: desktop-windows
          - os: ubuntu-22.04
            package-script: package:linux
            artifact-name: desktop-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build package
        shell: pwsh
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
        run: |
          pnpm ${{ matrix.package-script }} 2>&1 | Tee-Object -FilePath ci-build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.artifact-name }}
          path: |
            apps/desktop/ci-build.log
            apps/desktop/dist-electron/builder-debug.yml
            apps/desktop/dist-electron/*.yml
            apps/desktop/out/**/*
          if-no-files-found: ignore

      - name: Prepare release assets
        shell: pwsh
        working-directory: apps/desktop
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem dist-electron -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.AppImage', '.deb', '.yml' -and $_.Name -ne 'builder-debug.yml' } |
            Copy-Item -Destination release-assets
          Get-ChildItem release-assets | Format-Table Name,Length

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: apps/desktop/release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish desktop release
    runs-on: ubuntu-22.04
    needs: build-desktop

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Workbench Desktop ${{ github.ref_name }}"
          body: "Desktop release for AI Workbench."
          files: release-assets/**/*
