name: Release desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            package-script: package:win
            artifact-name: desktop-windows
          - os: ubuntu-22.04
            package-script: package:linux
            artifact-name: desktop-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Setup Python for native modules
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSBuild for native modules
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build package
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
          npm_config_msvs_version: 2022
        run: pnpm ${{ matrix.package-script }}

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.artifact-name }}
          path: |
            apps/desktop/dist-electron/builder-debug.yml
            apps/desktop/dist-electron/*.yml
            apps/desktop/out/**/*
          if-no-files-found: ignore

      - name: Prepare release assets
        shell: pwsh
        working-directory: apps/desktop
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem dist-electron -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.AppImage', '.deb', '.yml' -and $_.Name -ne 'builder-debug.yml' } |
            Copy-Item -Destination release-assets
          if (Test-Path release-assets/latest.yml) {
            $latest = Get-Content release-assets/latest.yml -Raw
            if ($latest -match '(?m)^path:\s*(.+)$') {
              $expectedExeName = $Matches[1].Trim()
              $actualExe = Get-ChildItem release-assets -Filter '*.exe' | Select-Object -First 1
              if ($actualExe -and $actualExe.Name -ne $expectedExeName) {
                Move-Item -LiteralPath $actualExe.FullName -Destination (Join-Path $actualExe.DirectoryName $expectedExeName) -Force
              }
              $expectedBlockmapName = "$expectedExeName.blockmap"
              $actualBlockmap = Get-ChildItem release-assets -Filter '*.exe.blockmap' | Select-Object -First 1
              if ($actualBlockmap -and $actualBlockmap.Name -ne $expectedBlockmapName) {
                Move-Item -LiteralPath $actualBlockmap.FullName -Destination (Join-Path $actualBlockmap.DirectoryName $expectedBlockmapName) -Force
              }
            }
          }
          Get-ChildItem release-assets | Format-Table Name,Length

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: apps/desktop/release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish desktop release
    runs-on: ubuntu-22.04
    needs: build-desktop

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Workbench ${{ github.ref_name }}"
          body: "Desktop release for AI Workbench."
          make_latest: true
          files: release-assets/**/*
