<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>Preflight</title>
    <style id="theme-vars">
/* User Management System - Light Professional Theme */
:root {
  /* Brand */
  --color-primary: #4f46e5;
  --color-primary-hover: #4338ca;
  --color-primary-foreground: #ffffff;
  --color-primary-muted: rgba(79, 70, 229, 0.12);
  --color-primary-soft: rgba(79, 70, 229, 0.06);
  --color-primary-ring: rgba(79, 70, 229, 0.35);

  /* Semantic aliases for Tailwind @theme inline bridge */
  --color-background: #f8f9fb;
  --color-foreground: #1a1d26;
  --color-card: #ffffff;
  --color-card-foreground: #1a1d26;
  --color-popover: #ffffff;
  --color-popover-foreground: #1a1d26;
  --color-muted: #6b7280;
  --color-muted-foreground: #6b7280;
  --color-border: #e2e5eb;
  --color-input: #e2e5eb;
  --color-ring: rgba(79, 70, 229, 0.35);
  --color-radius-sm: 6px;
  --color-radius-md: 8px;
  --color-radius-lg: 12px;

  /* Surface & Background */
  --color-bg-app: #f8f9fb;
  --color-bg-body: #f8f9fb;
  --color-bg-sidebar: #ffffff;
  --color-bg-main: #ffffff;
  --color-bg-content: #ffffff;
  --color-bg-surface: #ffffff;
  --color-bg-elevated: #ffffff;
  --color-bg-input: #ffffff;
  --color-bg-hover: rgba(0, 0, 0, 0.04);
  --color-bg-active: rgba(79, 70, 229, 0.08);

  /* Text */
  --color-text-primary: #1a1d26;
  --color-text-body: #374151;
  --color-text-secondary: #6b7280;
  --color-text-muted: #9ca3af;
  --color-text-placeholder: #9ca3af;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border-subtle: #f0f1f3;
  --color-border-active: var(--color-primary);

  /* State Colors */
  --state-success: #16a34a;
  --state-success-bg: rgba(22, 163, 74, 0.1);
  --state-success-ring: rgba(22, 163, 74, 0.25);
  --state-warning: #d97706;
  --state-warning-bg: rgba(217, 119, 6, 0.1);
  --state-error: #dc2626;
  --state-error-bg: rgba(220, 38, 38, 0.1);
  --state-info: #2563eb;
  --state-info-bg: rgba(37, 99, 235, 0.1);

  /* Radius */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;
  --text-3xl: 36px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  /* Font Weights */
  --fw-normal: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --fw-extrabold: 800;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
  --shadow-xl: 0 24px 56px rgba(0, 0, 0, 0.1);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;

  /* Transitions */
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-foreground: var(--color-foreground);
    --color-card: var(--color-card);
    --color-card-foreground: var(--color-card-foreground);
    --color-popover: var(--color-popover);
    --color-popover-foreground: var(--color-popover-foreground);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-primary-foreground);
    --color-muted: var(--color-muted);
    --color-muted-foreground: var(--color-muted-foreground);
    --color-border: var(--color-border);
    --color-input: var(--color-input);
    --color-ring: var(--color-ring);
    --radius-sm: var(--color-radius-sm);
    --radius-md: var(--color-radius-md);
    --radius-lg: var(--color-radius-lg);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
