name: remote_term_mobile
description: Mobile app for CodeHub AI desktop devices, projects, providers, and AI sessions.
publish_to: "none"
version: 0.1.86+86

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.3
  http: ^1.2.2
  mobile_scanner: 6.0.10
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/ai-workbench-app-icon.png
