# 生产环境部署配置：PostgreSQL + Go 后端一键启动
# 使用方法：
#   1. 修改下方环境变量（数据库密码、JWT 密钥）
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. 查看日志：docker compose -f docker-compose.prod.yml logs -f server
#   4. 更新版本：git pull && docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: remote_term
      POSTGRES_USER: remote_term
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-请改成强密码}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remote_term -d remote_term"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://remote_term:${POSTGRES_PASSWORD:-请改成强密码}@postgres:5432/remote_term
      JWT_SECRET: ${JWT_SECRET:-请改成随机字符串}
      PORT: "3000"
      MIGRATIONS_DIR: "./migrations"
      CORS_ORIGINS: "*"
    volumes:
      - ./backend/migrations:/app/migrations:ro

volumes:
  postgres-data:
