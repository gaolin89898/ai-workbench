<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* AI Workbench Desktop — Light Theme */
/* Matching actual project style.css exactly */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);
  --color-primary-ring: rgba(37, 99, 235, 0.18);

  /* Surface & Background */
  --color-bg-app: #f6f8fb;
  --color-bg-body: #fafafa;
  --color-bg-sidebar: #f7f7f7;
  --color-bg-main: #fafafa;
  --color-bg-content: #ffffff;
  --color-bg-surface: #f8fafc;
  --color-bg-elevated: #f1f5f9;
  --color-bg-input: #f8fafc;
  --color-bg-hover: #e9ecef;
  --color-bg-active: #eff6ff;

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-body: #111827;
  --color-text-secondary: #64748b;
  --color-text-muted: #94a3b8;
  --color-text-placeholder: #b7bcc5;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e5e7eb;
  --color-border-subtle: #eceff3;
  --color-border-active: #cbd5e1;

  /* State Colors */
  --state-success: #16a34a;
  --state-success-bg: #ecfdf5;
  --state-success-ring: #dcfce7;
  --state-warning: #f59e0b;
  --state-warning-bg: #fff7ed;
  --state-error: #dc2626;
  --state-error-bg: #fef2f2;
  --state-info: #2563eb;
  --state-info-bg: #eff6ff;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 7px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;
  --leading-chat: 1.62;

  /* Font Weights */
  --fw-normal: 400;
  --fw-medium: 500;
  --fw-semibold: 620;
  --fw-bold: 700;
  --fw-extrabold: 800;
  --fw-black: 850;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 10px 24px rgba(15, 23, 42, 0.12);
  --shadow-lg: 0 24px 56px rgba(15, 23, 42, 0.18);
  --shadow-composer: 0 16px 42px rgba(15, 23, 42, 0.07);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-14: 56px;
  --space-18: 72px;

  /* Layout */
  --sidebar-width: 286px;
  --topbar-height: 56px;
  --composer-max-width: 760px;

  /* Transitions */
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin: 0; background: var(--color-bg-body); color: var(--color-text-primary); font-family: var(--font-sans); height: 100vh; overflow: hidden;">
    <main style="display: grid; grid-template-columns: 286px minmax(760px, 1fr); height: 100vh; overflow: hidden;">

      <!-- ============================================================ -->
      <!-- LEFT SIDEBAR — Session Expand/Collapse State                -->
      <!-- ============================================================ -->
      <aside style="background: var(--color-bg-sidebar); border-right: 1px solid var(--color-border); padding: 18px 10px 14px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;">

        <!-- 项目 section header -->
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 13px; font-weight: 650; color: var(--color-text-muted);">项目</span>
          <button style="width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent; color: var(--color-text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;" aria-label="添加项目">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
          </button>
        </div>

        <!-- Project tree -->
        <div style="display: flex; flex-direction: column; gap: 2px;">

          <!-- my-saas-app project (expanded, 7 sessions) -->
          <div style="display: flex; flex-direction: column;">
            <!-- Project row -->
            <div style="display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px;">
              <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--color-text-muted); flex-shrink: 0;"></i>
              <i data-lucide="folder" style="width: 18px; height: 18px; color: var(--color-text-secondary); flex-shrink: 0;"></i>
              <span style="font-size: 14px; font-weight: 620; color: var(--color-text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">my-saas-app</span>
              <span style="font-size: 11px; color: var(--color-text-muted); background: var(--color-bg-elevated); padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.5;">main</span>
            </div>

            <!-- Session list under my-saas-app — EXPANDED STATE (all 7 visible) -->
            <div style="padding-left: 32px; display: flex; flex-direction: column; gap: 3px;">

              <!-- 1. 修复认证 bug — ACTIVE -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; background: var(--color-bg-hover); cursor: pointer; display: flex; align-items: center; gap: 6px;">
                <span style="color: #6366f1; font-size: 11px; flex-shrink: 0;">▾</span>
                <span style="font-size: 13px; color: var(--color-text-body); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">修复认证 bug</span>
                <span style="font-size: 11px; color: var(--color-text-muted); flex-shrink: 0; white-space: nowrap;">运行中</span>
              </div>

              <!-- 2. 优化 API 性能 — with unread dot -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                <span style="width: 8px; height: 8px; border-radius: 999px; background: var(--state-error); box-shadow: 0 0 0 2px rgba(239,68,68,0.18); flex-shrink: 0; display: inline-block;"></span>
                <span style="font-size: 13px; color: var(--color-text-muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">优化 API 性能</span>
              </div>

              <!-- 3. 添加单元测试 -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 13px; color: var(--color-text-muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">添加单元测试</span>
                <span style="font-size: 11px; color: var(--color-text-muted); flex-shrink: 0; white-space: nowrap;">2 小时</span>
              </div>

              <!-- 4. 重构侧边栏组件 -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 13px; color: var(--color-text-muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">重构侧边栏组件</span>
                <span style="font-size: 11px; color: var(--color-text-muted); flex-shrink: 0; white-space: nowrap;">昨天</span>
              </div>

              <!-- 5. 设计落地页 -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 13px; color: var(--color-text-muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">设计落地页</span>
                <span style="font-size: 11px; color: var(--color-text-muted); flex-shrink: 0; white-space: nowrap;">3 天前</span>
              </div>

              <!-- 6. 部署到生产环境 (expanded — visible) -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 13px; color: var(--color-text-muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">部署到生产环境</span>
                <span style="font-size: 11px; color: var(--color-text-muted); flex-shrink: 0; white-space: nowrap;">上周</span>
              </div>

              <!-- 7. 更新依赖版本 (expanded — visible) -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 13px; color: var(--color-text-muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">更新依赖版本</span>
                <span style="font-size: 11px; color: var(--color-text-muted); flex-shrink: 0; white-space: nowrap;">2 周前</span>
              </div>

              <!-- 收起 button -->
              <button style="display: flex; width: 100%; margin-top: 6px; padding: 6px 8px 6px 32px; border: 0; border-radius: 7px; background: transparent; color: var(--color-text-muted); font-size: 12.5px; font-weight: 500; cursor: pointer; font-family: var(--font-sans);">
                收起
              </button>

            </div>
          </div>

          <!-- ai-workbench project (collapsed) -->
          <div style="display: flex; flex-direction: column;">
            <!-- Project row -->
            <div style="display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px;">
              <i data-lucide="chevron-right" style="width: 14px; height: 14px; color: var(--color-text-muted); flex-shrink: 0;"></i>
              <i data-lucide="folder" style="width: 18px; height: 18px; color: var(--color-text-secondary); flex-shrink: 0;"></i>
              <span style="font-size: 14px; font-weight: 620; color: var(--color-text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">ai-workbench</span>
            </div>
          </div>

        </div>

        <!-- Spacer pushing settings to bottom -->
        <div style="flex: 1; min-height: 0;"></div>

        <!-- Settings button at bottom -->
        <button style="min-height: 42px; border: none; background: transparent; color: var(--color-text-secondary); cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0 6px; font-size: 14px; font-weight: 650; font-family: var(--font-sans);" aria-label="设置">
          <i data-lucide="settings" style="width: 18px; height: 18px;"></i>
          <span>设置</span>
        </button>

      </aside>

      <!-- ============================================================ -->
      <!-- MAIN CONTENT — ChatView codex-start empty state              -->
      <!-- ============================================================ -->
      <div style="background: var(--color-bg-content); display: flex; flex-direction: column; height: 100vh; overflow: hidden;">

        <!-- No topbar — this is the empty start state -->

        <!-- Center area -->
        <div style="display: grid; place-items: center; min-height: 100vh; padding: 48px 32px;">
          <div style="width: min(730px, 100%); display: grid; gap: 28px; justify-items: center; transform: translateY(-28px);">

            <!-- Heading -->
            <h1 style="font-size: 28px; font-weight: 520; color: var(--color-text-primary); text-align: center; line-height: 1.25; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word; margin: 0;">
              在 my-saas-app 中要做什么？
            </h1>

            <!-- Prompt box container -->
            <div style="width: 100%; border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-bg-surface); box-shadow: var(--shadow-composer); position: relative;">
              <textarea
                style="width: 100%; min-height: 112px; max-height: 160px; border-radius: 18px; padding: 14px 66px 52px 14px; font-size: 14px; line-height: 1.5; resize: none; background: transparent; color: var(--color-text-primary); border: none; outline: none; font-family: var(--font-sans);"
                placeholder="描述你想做什么..."
                rows="3"
                aria-label="输入提示"
              ></textarea>

              <!-- Provider selector button -->
              <button style="position: absolute; left: 14px; bottom: 14px; height: 32px; background: transparent; border: none; color: var(--color-text-secondary); font-size: 13px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 0 4px; font-family: var(--font-sans);" aria-label="选择模型">
                <i data-lucide="sparkles" style="width: 19px; height: 19px; color: var(--color-primary);"></i>
                <span>Codex</span>
                <i data-lucide="chevron-down" style="width: 14px; height: 14px;"></i>
              </button>

              <!-- Send button -->
              <button style="position: absolute; right: 14px; bottom: 14px; width: 34px; height: 34px; border: 1px solid var(--color-primary-muted); border-radius: 999px; background: var(--color-primary-muted); color: var(--color-primary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;" aria-label="发送">
                <i data-lucide="arrow-up" style="width: 19px; height: 19px;"></i>
              </button>

            </div>

          </div>
        </div>

      </div>

    </main>

    <style>
      textarea::placeholder { color: var(--color-text-placeholder); }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-bg-elevated); border-radius: 999px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
