<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工作台</title>
    <style id="theme-vars">
/* AI Workbench Desktop — Light Theme */
/* Matching actual project style.css exactly */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);
  --color-primary-ring: rgba(37, 99, 235, 0.18);

  /* Surface & Background */
  --color-bg-app: #f6f8fb;
  --color-bg-body: #fafafa;
  --color-bg-sidebar: #f7f7f7;
  --color-bg-main: #fafafa;
  --color-bg-content: #ffffff;
  --color-bg-surface: #f8fafc;
  --color-bg-elevated: #f1f5f9;
  --color-bg-input: #f8fafc;
  --color-bg-hover: #e9ecef;
  --color-bg-active: #eff6ff;

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-body: #111827;
  --color-text-secondary: #64748b;
  --color-text-muted: #94a3b8;
  --color-text-placeholder: #b7bcc5;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e5e7eb;
  --color-border-subtle: #eceff3;
  --color-border-active: #cbd5e1;

  /* State Colors */
  --state-success: #16a34a;
  --state-success-bg: #ecfdf5;
  --state-success-ring: #dcfce7;
  --state-warning: #f59e0b;
  --state-warning-bg: #fff7ed;
  --state-error: #dc2626;
  --state-error-bg: #fef2f2;
  --state-info: #2563eb;
  --state-info-bg: #eff6ff;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 7px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;
  --leading-chat: 1.62;

  /* Font Weights */
  --fw-normal: 400;
  --fw-medium: 500;
  --fw-semibold: 620;
  --fw-bold: 700;
  --fw-extrabold: 800;
  --fw-black: 850;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 10px 24px rgba(15, 23, 42, 0.12);
  --shadow-lg: 0 24px 56px rgba(15, 23, 42, 0.18);
  --shadow-composer: 0 16px 42px rgba(15, 23, 42, 0.07);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-14: 56px;
  --space-18: 72px;

  /* Layout */
  --sidebar-width: 286px;
  --topbar-height: 56px;
  --composer-max-width: 760px;

  /* Transitions */
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin: 0; background: var(--color-bg-body); color: var(--color-text-primary); font-family: var(--font-sans); height: 100vh; overflow: hidden;">
    <main style="display: grid; grid-template-columns: 286px minmax(760px, 1fr); height: 100vh; overflow: hidden;">

      <!-- ============================================================ -->
      <!-- LEFT SIDEBAR                                                  -->
      <!-- ============================================================ -->
      <aside style="background: var(--color-bg-sidebar); border-right: 1px solid var(--color-border); padding: 18px 10px 14px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;">

        <!-- 项目 section header -->
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 13px; font-weight: 650; color: var(--color-text-muted);">项目</span>
          <button style="width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent; color: var(--color-text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;" aria-label="添加项目">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
          </button>
        </div>

        <!-- Project tree -->
        <div style="display: flex; flex-direction: column; gap: 2px;">

          <!-- my-saas-app project (expanded, file list active) -->
          <div style="display: flex; flex-direction: column;">
            <!-- Project row -->
            <div style="display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px;">
              <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--color-text-muted); flex-shrink: 0;"></i>
              <i data-lucide="folder" style="width: 18px; height: 18px; color: var(--color-text-secondary); flex-shrink: 0;"></i>
              <span style="font-size: 14px; font-weight: 620; color: var(--color-text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">my-saas-app</span>
              <span style="font-size: 11px; color: var(--color-text-muted); background: var(--color-bg-elevated); padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.5;">main</span>
              <!-- File list icon (active/highlighted) -->
              <button style="width: 28px; height: 28px; border-radius: 6px; border: none; background: var(--color-bg-hover); color: var(--color-text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;" aria-label="文件列表">
                <i data-lucide="list" style="width: 15px; height: 15px;"></i>
              </button>
            </div>

            <!-- File list under my-saas-app -->
            <div style="padding-left: 0; display: flex; flex-direction: column; gap: 0;">

              <!-- ▸ src (folder) -->
              <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px 0 32px; cursor: pointer;">
                <span style="font-size: 14px; color: var(--color-text-muted); flex-shrink: 0; width: 14px; text-align: center;">▸</span>
                <span style="font-size: 14px; color: var(--color-text-body); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">src</span>
              </div>

              <!-- ▸ public (folder) -->
              <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px 0 32px; cursor: pointer;">
                <span style="font-size: 14px; color: var(--color-text-muted); flex-shrink: 0; width: 14px; text-align: center;">▸</span>
                <span style="font-size: 14px; color: var(--color-text-body); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">public</span>
              </div>

              <!-- ▸ tests (folder) -->
              <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px 0 32px; cursor: pointer;">
                <span style="font-size: 14px; color: var(--color-text-muted); flex-shrink: 0; width: 14px; text-align: center;">▸</span>
                <span style="font-size: 14px; color: var(--color-text-body); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">tests</span>
              </div>

              <!-- • package.json (1.2 KB) -->
              <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px 0 32px; cursor: pointer;">
                <span style="font-size: 14px; color: var(--color-text-muted); flex-shrink: 0; width: 14px; text-align: center;">•</span>
                <span style="font-size: 14px; color: var(--color-text-body); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">package.json</span>
                <span style="font-size: 12px; color: var(--color-text-muted); margin-left: auto; white-space: nowrap; flex-shrink: 0;">1.2 KB</span>
              </div>

              <!-- • tsconfig.json (0.8 KB) -->
              <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px 0 32px; cursor: pointer;">
                <span style="font-size: 14px; color: var(--color-text-muted); flex-shrink: 0; width: 14px; text-align: center;">•</span>
                <span style="font-size: 14px; color: var(--color-text-body); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">tsconfig.json</span>
                <span style="font-size: 12px; color: var(--color-text-muted); margin-left: auto; white-space: nowrap; flex-shrink: 0;">0.8 KB</span>
              </div>

              <!-- • README.md (3.4 KB) -->
              <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px 0 32px; cursor: pointer;">
                <span style="font-size: 14px; color: var(--color-text-muted); flex-shrink: 0; width: 14px; text-align: center;">•</span>
                <span style="font-size: 14px; color: var(--color-text-body); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">README.md</span>
                <span style="font-size: 12px; color: var(--color-text-muted); margin-left: auto; white-space: nowrap; flex-shrink: 0;">3.4 KB</span>
              </div>

            </div>
          </div>

          <!-- ai-workbench project (collapsed) -->
          <div style="display: flex; flex-direction: column;">
            <!-- Project row -->
            <div style="display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px;">
              <i data-lucide="chevron-right" style="width: 14px; height: 14px; color: var(--color-text-muted); flex-shrink: 0;"></i>
              <i data-lucide="folder" style="width: 18px; height: 18px; color: var(--color-text-secondary); flex-shrink: 0;"></i>
              <span style="font-size: 14px; font-weight: 620; color: var(--color-text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">ai-workbench</span>
            </div>

            <!-- Session list under ai-workbench -->
            <div style="padding-left: 32px; display: flex; flex-direction: column; gap: 3px;">
              <!-- 重构数据库查询 -->
              <div style="padding: 5px 8px 5px 10px; border-radius: 6px; cursor: pointer;">
                <span style="font-size: 13px; color: var(--color-text-muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">重构数据库查询</span>
              </div>
            </div>
          </div>

        </div>

        <!-- Spacer pushing settings to bottom -->
        <div style="flex: 1; min-height: 0;"></div>

        <!-- Account profile entry at bottom -->
        <button style="min-height: 48px; width: 100%; border: 1px solid var(--color-border-subtle); border-radius: 12px; background: transparent; color: var(--color-text-primary); cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 7px 8px; font-family: var(--font-sans); text-align: left; transition: background var(--transition-fast), border-color var(--transition-fast);" aria-label="打开个人账户菜单" onmouseenter="this.style.background='var(--color-bg-hover)'" onmouseleave="this.style.background='transparent'" onmousedown="this.style.background='var(--color-bg-active)'" onmouseup="this.style.background='var(--color-bg-hover)'">
          <span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--color-primary), #8b5cf6); color: var(--color-text-inverse); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0;">李</span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1;">
            <span style="font-size: 13px; font-weight: 720; color: var(--color-text-primary); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">李明</span>
            <span style="font-size: 11px; font-weight: 500; color: var(--color-text-muted); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">li@workbench.ai</span>
          </span>
          <i data-lucide="chevron-down" style="width: 16px; height: 16px; color: var(--color-text-muted); flex-shrink: 0;"></i>
        </button>

      </aside>

      <!-- ============================================================ -->
      <!-- MAIN CONTENT — ChatView codex-start empty state              -->
      <!-- ============================================================ -->
      <div style="background: var(--color-bg-content); display: flex; flex-direction: column; height: 100vh; overflow: hidden;">

        <!-- No topbar — this is the empty start state -->

        <!-- Center area -->
        <div style="display: grid; place-items: center; min-height: 100vh; padding: 48px 32px;">
          <div style="width: min(730px, 100%); display: grid; gap: 28px; justify-items: center; transform: translateY(-28px);">

            <!-- Heading -->
            <h1 style="font-size: 28px; font-weight: 520; color: var(--color-text-primary); text-align: center; line-height: 1.25; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word; margin: 0;">
              在 my-saas-app 中要做什么？
            </h1>

            <!-- Prompt box container -->
            <div style="width: 100%; border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-bg-surface); box-shadow: var(--shadow-composer); position: relative;">
              <textarea
                style="width: 100%; min-height: 112px; max-height: 160px; border-radius: 18px; padding: 14px 66px 52px 14px; font-size: 14px; line-height: 1.5; resize: none; background: transparent; color: var(--color-text-primary); border: none; outline: none; font-family: var(--font-sans);"
                placeholder="描述你想做什么..."
                rows="3"
                aria-label="输入提示"
              ></textarea>

              <!-- Provider selector button -->
              <button style="position: absolute; left: 14px; bottom: 14px; height: 32px; background: transparent; border: none; color: var(--color-text-secondary); font-size: 13px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 0 4px; font-family: var(--font-sans);" aria-label="选择模型">
                <i data-lucide="sparkles" style="width: 19px; height: 19px; color: var(--color-primary);"></i>
                <span>Codex</span>
                <i data-lucide="chevron-down" style="width: 14px; height: 14px;"></i>
              </button>

              <!-- Send button -->
              <button style="position: absolute; right: 14px; bottom: 14px; width: 34px; height: 34px; border: 1px solid var(--color-primary-muted); border-radius: 999px; background: var(--color-primary-muted); color: var(--color-primary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;" aria-label="发送">
                <i data-lucide="arrow-up" style="width: 19px; height: 19px;"></i>
              </button>

            </div>

          </div>
        </div>

      </div>

    </main>

    <!-- ============================================================ -->
    <!-- PROJECT CONTEXT MENU (fixed overlay)                         -->
    <!-- ============================================================ -->
    <div style="position: fixed; z-index: 100; top: 90px; left: 240px; width: 196px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; background: var(--color-bg-elevated); padding: 4px; box-shadow: var(--shadow-md);">

      <!-- 置顶项目 (DISABLED) -->
      <button disabled style="display: flex; align-items: center; gap: 8px; min-height: 32px; border-radius: 6px; padding: 0 8px; font-size: 14px; font-weight: 520; border: 0; background: transparent; color: var(--color-text-muted); cursor: default; width: 100%; font-family: var(--font-sans);">
        <span style="font-size: 18px; opacity: 0.55; flex-shrink: 0; width: 18px; text-align: center; line-height: 1;">📌</span>
        <span>置顶项目</span>
      </button>

      <!-- 在文件管理器中打开 -->
      <button style="display: flex; align-items: center; gap: 8px; min-height: 32px; border-radius: 6px; padding: 0 8px; font-size: 14px; font-weight: 520; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; width: 100%; font-family: var(--font-sans);">
        <span style="font-size: 18px; opacity: 0.85; flex-shrink: 0; width: 18px; text-align: center; line-height: 1;">📂</span>
        <span>在文件管理器中打开</span>
      </button>

      <!-- 创建永久工作树 (DISABLED) -->
      <button disabled style="display: flex; align-items: center; gap: 8px; min-height: 32px; border-radius: 6px; padding: 0 8px; font-size: 14px; font-weight: 520; border: 0; background: transparent; color: var(--color-text-muted); cursor: default; width: 100%; font-family: var(--font-sans);">
        <span style="font-size: 18px; opacity: 0.55; flex-shrink: 0; width: 18px; text-align: center; line-height: 1;">🌿</span>
        <span>创建永久工作树</span>
      </button>

      <!-- 重命名项目 -->
      <button style="display: flex; align-items: center; gap: 8px; min-height: 32px; border-radius: 6px; padding: 0 8px; font-size: 14px; font-weight: 520; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; width: 100%; font-family: var(--font-sans);">
        <span style="font-size: 18px; opacity: 0.85; flex-shrink: 0; width: 18px; text-align: center; line-height: 1;">✏️</span>
        <span>重命名项目</span>
      </button>

      <!-- 归档对话 -->
      <button style="display: flex; align-items: center; gap: 8px; min-height: 32px; border-radius: 6px; padding: 0 8px; font-size: 14px; font-weight: 520; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; width: 100%; font-family: var(--font-sans);">
        <span style="font-size: 18px; opacity: 0.85; flex-shrink: 0; width: 18px; text-align: center; line-height: 1;">📦</span>
        <span>归档对话</span>
      </button>

      <!-- 从列表移除 -->
      <button style="display: flex; align-items: center; gap: 8px; min-height: 32px; border-radius: 6px; padding: 0 8px; font-size: 14px; font-weight: 520; border: 0; background: transparent; color: var(--color-text-body); cursor: pointer; width: 100%; font-family: var(--font-sans);">
        <span style="font-size: 18px; opacity: 0.85; flex-shrink: 0; width: 18px; text-align: center; line-height: 1;">🗑️</span>
        <span>从列表移除</span>
      </button>

    </div>

    <style>
      textarea::placeholder { color: var(--color-text-placeholder); }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-bg-elevated); border-radius: 999px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
