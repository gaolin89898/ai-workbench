<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工作台 - 登录</title>
    <style id="theme-vars">
/* AI Workbench Desktop — Light Theme */
/* Matching actual project style.css exactly */
:root {
  /* Brand */
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-primary-muted: rgba(37, 99, 235, 0.12);
  --color-primary-soft: rgba(37, 99, 235, 0.06);
  --color-primary-ring: rgba(37, 99, 235, 0.18);

  /* Surface & Background */
  --color-bg-app: #f6f8fb;
  --color-bg-body: #fafafa;
  --color-bg-sidebar: #f7f7f7;
  --color-bg-main: #fafafa;
  --color-bg-content: #ffffff;
  --color-bg-surface: #f8fafc;
  --color-bg-elevated: #f1f5f9;
  --color-bg-input: #f8fafc;
  --color-bg-hover: #e9ecef;
  --color-bg-active: #eff6ff;

  /* Text */
  --color-text-primary: #0f172a;
  --color-text-body: #111827;
  --color-text-secondary: #64748b;
  --color-text-muted: #94a3b8;
  --color-text-placeholder: #b7bcc5;
  --color-text-inverse: #ffffff;

  /* Border */
  --color-border: #e5e7eb;
  --color-border-subtle: #eceff3;
  --color-border-active: #cbd5e1;

  /* State Colors */
  --state-success: #16a34a;
  --state-success-bg: #ecfdf5;
  --state-success-ring: #dcfce7;
  --state-warning: #f59e0b;
  --state-warning-bg: #fff7ed;
  --state-error: #dc2626;
  --state-error-bg: #fef2f2;
  --state-info: #2563eb;
  --state-info-bg: #eff6ff;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 7px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 999px;

  /* Typography */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;
  --leading-chat: 1.62;

  /* Font Weights */
  --fw-normal: 400;
  --fw-medium: 500;
  --fw-semibold: 620;
  --fw-bold: 700;
  --fw-extrabold: 800;
  --fw-black: 850;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 10px 24px rgba(15, 23, 42, 0.12);
  --shadow-lg: 0 24px 56px rgba(15, 23, 42, 0.18);
  --shadow-composer: 0 16px 42px rgba(15, 23, 42, 0.07);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-14: 56px;
  --space-18: 72px;

  /* Layout */
  --sidebar-width: 286px;
  --topbar-height: 56px;
  --composer-max-width: 760px;

  /* Transitions */
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-bg-app); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: var(--font-sans);">
    <main style="width: 100%; max-width: 420px; padding: var(--space-6);">
        <!-- Login Card -->
        <div style="background: var(--color-bg-content); border: 1px solid var(--color-border); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); padding: 28px 32px;">

            <!-- App Branding Area -->
            <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: var(--space-8);">
                <!-- App Icon -->
                <div style="width: 48px; height: 48px; border-radius: var(--radius-lg); background: var(--color-primary); display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-4);">
                    <i data-lucide="layout-grid" style="width: 24px; height: 24px; color: var(--color-text-inverse);"></i>
                </div>
                <!-- Title -->
                <div style="font-size: var(--text-xl); font-weight: var(--fw-bold); color: var(--color-text-primary); line-height: var(--leading-tight); margin-bottom: var(--space-1);">
                    AI 工作台
                </div>
                <!-- Subtitle -->
                <div style="font-size: var(--text-base); color: var(--color-text-secondary); line-height: var(--leading-normal);">
                    桌面端 AI 编程助手
                </div>
            </div>

            <!-- Login Form -->
            <div style="display: flex; flex-direction: column; gap: var(--space-5);">
                <!-- Account -->
                <div style="display: flex; flex-direction: column;">
                    <label style="font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; font-weight: var(--fw-medium);">账号</label>
                    <input
                        type="text"
                        placeholder="请输入账号"
                        style="height: 42px; width: 100%; padding: 0 14px; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg-content); color: var(--color-text-primary); font-size: var(--text-base); font-family: var(--font-sans); outline: none; box-sizing: border-box; transition: border-color var(--transition-fast);"
                        onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 3px var(--color-primary-ring)'"
                        onblur="this.style.borderColor='var(--color-border)'; this.style.boxShadow='none'"
                    >
                </div>

                <!-- Password -->
                <div style="display: flex; flex-direction: column;">
                    <label style="font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; font-weight: var(--fw-medium);">密码</label>
                    <input
                        type="password"
                        placeholder="请输入密码"
                        style="height: 42px; width: 100%; padding: 0 14px; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg-content); color: var(--color-text-primary); font-size: var(--text-base); font-family: var(--font-sans); outline: none; box-sizing: border-box; transition: border-color var(--transition-fast);"
                        onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 3px var(--color-primary-ring)'"
                        onblur="this.style.borderColor='var(--color-border)'; this.style.boxShadow='none'"
                    >
                </div>

                <!-- Primary Button -->
                <button style="height: 42px; width: 100%; border: none; border-radius: var(--radius-lg); background: var(--color-primary); color: var(--color-text-inverse); font-size: var(--text-md); font-weight: var(--fw-bold); font-family: var(--font-sans); cursor: pointer; transition: background var(--transition-fast); box-sizing: border-box;"
                    onmouseenter="this.style.background='var(--color-primary-hover)'"
                    onmouseleave="this.style.background='var(--color-primary)'"
                >
                    登录
                </button>

                <!-- Hint Text -->
                <div style="font-size: var(--text-sm); color: var(--color-text-muted); text-align: center; line-height: var(--leading-normal); margin-top: -2px;">
                    还没有账号？<span style="color: var(--color-primary); cursor: pointer;">立即注册</span>
                </div>
            </div>

            <!-- Footer Version -->
            <div style="font-size: var(--text-sm); color: var(--color-text-muted); text-align: center; margin-top: var(--space-5);">
                v0.3.2
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
